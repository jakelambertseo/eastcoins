<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EastScape</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- EastScape: the page only draws. Everything that happens is decided by the game server
     (eastscape-worker, a Cloudflare Durable Object), which also keeps your character: saving
     is continuous and automatic. Rules shared with the server: /v3/assets/js/eastscape-shared.js -->
<style>
:root{--ink:#e8e0cc;--muted:#9a917e;--gold:#f2c94c;--panel:#f3e7cc;--panel-ink:#2a2016;--frame:#1a1410;--bar:#0b0908;--link-a:#7ee07e;--link-b:#e0e0e0;--good:#7ee07e;--bad:#ff7a6a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;overflow:hidden}
button,input,select{font:inherit}
.top{height:32px;display:flex;align-items:center;gap:22px;padding:0 12px;background:var(--bar);border-bottom:2px solid #2a2118;font-size:15px;white-space:nowrap;overflow:hidden}
.top .logo{font-weight:800;color:#7ee07e;font-size:18px}
.top .me{color:#fff;font-weight:700}
.top .clock{color:#fff;font-variant-numeric:tabular-nums}
.top a{color:var(--link-b);text-decoration:none}
.top a:hover{text-decoration:underline}
.top .spacer{flex:1}
.top .online{color:#ffd23f}
.net{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:#b8b0a0}
.net i{width:8px;height:8px;border-radius:50%;background:#6a6258;display:inline-block}
.net.ok i{background:#5dd65d;box-shadow:0 0 6px #5dd65d}
.net.warn i{background:#ffb400}
.net.bad i{background:#ff5a4a}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 32px)}
/* the character panel sits on the LEFT: on the site, Twitch chat takes the right */
.wrap .side{order:-1;border-left:0;border-right:2px solid #2a2118}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:60vh auto;overflow:auto;height:auto}html,body{overflow:auto}}
.game{position:relative;background:#000;overflow:hidden;min-height:320px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:pointer;touch-action:none}
.dbg{position:absolute;left:10px;top:8px;color:#ffe45c;font-size:13px;line-height:1.35;text-shadow:1px 1px 0 #000,0 0 3px #000;pointer-events:none;white-space:pre}
.dbg[hidden]{display:none}
.dlg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px 14px;background:var(--panel);color:var(--panel-ink);border:3px solid var(--frame);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.dlg[hidden]{display:none}
.game:has(.dlg:not([hidden])) .feed{bottom:190px}
.dlg-face{width:84px;height:84px;border:2px solid #8a7a5a;background:#d8cbac;display:grid;place-items:center;overflow:hidden;font-size:40px}
.dlg-face img{width:136px;height:136px;image-rendering:pixelated;object-fit:none;object-position:50% 28%}
.dlg-body b{display:block;font-size:16px;color:#7a2a1a}
.dlg-body p{margin:4px 0 8px;font-size:15px;line-height:1.35}
.dlg-opts{display:grid;gap:4px}
.dlg-opts button{text-align:left;font-size:14px;font-weight:700;padding:5px 9px;border:1px solid #bfb193;background:#e6dcc4;color:#2a2016;border-radius:4px;cursor:pointer}
.dlg-opts button:hover,.dlg-opts button:focus-visible{background:#fff3c8;border-color:#8a7a5a;outline:none}
.dlg-opts button span{color:#7a2a1a;margin-right:4px}
.dlg-x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:#6a5a40}
.pop{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);z-index:8}
.pop[hidden]{display:none}
.pop-card{width:min(380px,calc(100% - 32px));padding:18px 20px 16px;background:var(--panel);color:var(--panel-ink);border:3px solid var(--frame);border-radius:8px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
.pop-ico{font-size:34px;line-height:1}
.pop-card b{display:block;font-size:19px;margin:6px 0 4px;color:#7a2a1a}
.pop-card p{margin:0 0 14px;font-size:15px;line-height:1.4}
.pop-btns{display:flex;gap:8px;justify-content:center}
.btn{font-weight:800;font-size:14px;padding:7px 18px;border:2px solid #000;border-radius:4px;background:linear-gradient(#f39ab5,#d9738f);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.plain{background:linear-gradient(#e6dcc4,#cfc2a2);color:#2a2016}
.btn.danger{background:linear-gradient(#e0605a,#b83a34)}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.qdone{position:absolute;left:50%;top:84px;transform:translateX(-50%);text-align:center;padding:12px 28px;background:linear-gradient(#3a2a14,#1e160c);border:3px solid #e8bf35;border-radius:8px;color:#fff;box-shadow:0 0 30px rgba(232,191,53,.45);z-index:6;pointer-events:none}
.qdone[hidden]{display:none}
.qdone small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e8bf35;font-weight:800}
.qdone b{display:block;font-size:24px;margin:2px 0}
.qdone span{font-size:14px;color:#e8dcc0}
.qdone.show{animation:qpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes qpop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.qdone.show{animation:none}}
.feed{position:absolute;left:10px;bottom:10px;width:min(520px,70%);display:flex;flex-direction:column;gap:2px;pointer-events:none}
.feed p{margin:0;align-self:flex-start;max-width:100%;padding:3px 9px;border-radius:3px;background:rgba(14,11,8,.72);font-size:14px;line-height:1.3;text-shadow:1px 1px 0 #000;animation:feedOut 9s linear forwards}
@keyframes feedOut{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.feed p{animation:none}}
.feed .sys{color:#e8e0cc}
.feed .good{color:#7ee07e}
.feed .loot{color:#ffd23f}
.feed .bad{color:#ff7a6a}
.feed .admin{color:#8fd0ff}
/* the door for visitors who aren't signed in, and the "reconnecting" veil */
.cover{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,5,4,.78);z-index:9;padding:16px}
.cover[hidden]{display:none}
.cover .card{max-width:420px;padding:22px 24px;background:var(--panel);color:var(--panel-ink);border:3px solid var(--frame);border-radius:8px;text-align:center}
.cover .card h2{margin:4px 0 6px;font-size:22px;color:#7a2a1a}
.cover .card p{margin:0 0 14px;font-size:15px;line-height:1.45}
.cover.soft{background:rgba(6,5,4,.45)}
.cover.soft .card{padding:14px 18px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #8a7a5a;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.side{display:flex;flex-direction:column;background:#141010;min-height:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 14px;background:#0e0c0a;border-bottom:2px solid #2a2118}
.stat{display:flex;align-items:center;gap:10px;font-size:16px}
.stat i{font-style:normal;font-size:22px;width:28px;text-align:center}
.stat b{font-weight:700;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;padding:8px}
.tabs button{height:40px;min-width:0;padding:0;border:2px solid #000;border-radius:4px;background:linear-gradient(#5a5048,#3a322c);color:#fff;font-size:18px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tabs button[hidden]{display:none}
.tabs button[aria-pressed="true"]{background:linear-gradient(#f39ab5,#d9738f);outline:2px solid #fff2;outline-offset:-4px}
.tabs button:focus-visible{outline:2px solid var(--gold)}
.panel{flex:1;margin:0 8px 8px;background:var(--panel);color:var(--panel-ink);border:3px solid var(--frame);overflow:auto;min-height:0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:14px;border-bottom:2px solid rgba(0,0,0,.12)}
.ph small{font-weight:600;text-transform:none;color:#6a5a40}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px}
.slot{position:relative;aspect-ratio:1;border:1px solid #bfb193;background:#e6dcc4;display:grid;place-items:center;font-size:26px;cursor:pointer;user-select:none}
.slot:hover{background:#efe6d0}
.slot.empty{cursor:default;background:#e2d8bf}
.slot.hint{outline:3px solid #ffb400;outline-offset:-3px;animation:hint .6s ease-in-out infinite alternate}
@keyframes hint{from{background:#e6dcc4}to{background:#ffe27a}}
@media (prefers-reduced-motion:reduce){.slot.hint{animation:none;background:#ffe27a}}
.slot em{position:absolute;left:2px;top:0;font-style:normal;font-size:12px;font-weight:800;color:#ff0;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000,1px 0 0 #000}
.doll{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(4,64px);gap:6px;justify-content:center;padding:14px 6px 8px;
  grid-template-areas:". helm ." "weapon body shield" ". legs ." "gloves boots ring"}
.eq{border:2px solid #8a7a5a;border-radius:4px;background:#d8cbac;display:grid;place-items:center;font-size:30px;position:relative;cursor:pointer;color:inherit;padding:0}
.eq:hover:not(:disabled){background:#e6dcc4}
.eq:disabled{cursor:default}
.eq small{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:#5a4a30}
.eq.empty{opacity:.55;font-size:22px;filter:grayscale(1)}
.bonl{margin:4px 8px 8px;border:2px solid #8a7a5a;background:#e6dcc4}
.bonl .bh{padding:4px 8px;font-size:13px;color:#5a4a30;border-bottom:2px solid #bfb193}
.bonl div:not(.bh){display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:4px 8px;font-size:13px;border-bottom:1px solid #d0c4a8}
.bonl i{font-style:normal;text-align:center}
.sk{display:grid;gap:6px;padding:8px}
.skr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 8px;background:#e6dcc4;border:1px solid #bfb193}
.skr i{font-style:normal;font-size:22px;text-align:center}
.skr b{display:block;font-size:15px}
.skr small{display:block;font-size:12px;color:#6a5a40}
.skr .lv{font-size:20px;font-weight:800;color:#2a6a1a}
.xpb{height:6px;background:#bfb193;margin-top:3px}
.xpb i{display:block;height:100%;background:#3f9a2e}
.qs{display:grid;gap:6px;padding:8px}
.q{padding:8px 10px;background:#e6dcc4;border:1px solid #bfb193}
.q b{display:block;font-size:15px}
.q small{display:block;font-size:13px;color:#6a5a40}
.q.done b{color:#2a6a1a}
.q .qtag{display:inline-block;font-style:normal;font-size:11px;font-weight:800;padding:1px 6px;border-radius:3px;background:#d0c4a8;color:#5a4a30;margin:2px 0 3px}
.q.ready .qtag{background:#ffd23f;color:#3a2a00}
.q.active .qtag{background:#9fd07a;color:#1a3a0a}
.q.done{opacity:.75}
.q.locked{opacity:.5}
.note{padding:8px 12px;font-size:13px;color:#6a5a40}
/* settings: a list of switches */
.sets{display:grid;gap:2px;padding:6px}
.set{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 8px;background:#e6dcc4;border:1px solid #bfb193;cursor:pointer}
.set b{display:block;font-size:14px}
.set small{display:block;font-size:12px;color:#6a5a40;line-height:1.3}
.sw{position:relative;width:40px;height:22px}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:11px;background:#b8ab8c;transition:background .15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+span{background:#4a9a3a}
.sw input:checked+span::after{transform:translateX(18px)}
.sw input:focus-visible+span{outline:2px solid #7a2a1a;outline-offset:2px}
/* admin */
.adm{display:grid;gap:8px;padding:8px}
.adm fieldset{border:1px solid #bfb193;background:#e6dcc4;margin:0;padding:8px;display:grid;gap:6px}
.adm legend{font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#5a4a30;padding:0 4px}
.adm .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.adm select,.adm input{padding:4px 6px;border:1px solid #8a7a5a;border-radius:3px;background:#fffaf0;color:#2a2016;min-width:0}
.adm input[type=number]{width:84px}
.adm .btn{padding:4px 10px;font-size:13px}
.adm pre{margin:0;max-height:220px;overflow:auto;font-size:11px;background:#fffaf0;border:1px solid #bfb193;padding:6px;white-space:pre-wrap;word-break:break-all}
.adm .tag{font-size:12px;color:#6a5a40}
</style>
</head>
<body>
<header class="top">
  <span class="logo">⚔ EastScape</span>
  <span class="me" id="topName">—</span>
  <span class="clock" id="clock">--:--:--</span>
  <a href="/" title="Back to EastCoin">EastCoin</a>
  <span class="spacer"></span>
  <span class="net" id="net" role="status" aria-live="polite"><i></i><span id="netText">Connecting…</span></span>
  <span class="online" id="online"></span>
</header>
<main class="wrap">
  <section class="game" aria-label="Game">
    <canvas id="cv"></canvas>
    <div class="dbg" id="dbg" hidden></div>
    <!-- no in-game chat: the game sits beside the site's Twitch chat. These are the game's own messages. -->
    <div class="feed" id="log" aria-live="polite"></div>
    <div class="dlg" id="dlg" role="dialog" aria-label="Conversation" hidden>
      <div class="dlg-face" id="dlgFace"></div>
      <div class="dlg-body"><b id="dlgName"></b><p id="dlgText"></p><div class="dlg-opts" id="dlgOpts"></div></div>
      <button type="button" class="dlg-x" id="dlgX" aria-label="Close">×</button>
    </div>
    <div class="qdone" id="qdone" hidden></div>
    <div class="pop" id="pop" role="alertdialog" aria-modal="true" aria-labelledby="popTitle" hidden>
      <div class="pop-card"><div class="pop-ico" id="popIco"></div><b id="popTitle"></b><p id="popText"></p><div class="pop-btns" id="popBtns"></div></div>
    </div>
    <div class="cover" id="gate" hidden>
      <div class="card"><div style="font-size:36px">⚔️</div><h2>EastScape is members-only</h2><p>Log in with Twitch to play. Your character is saved to your Twitch account, so you can pick up from any browser.</p><a class="btn" href="/api/picks/auth/twitch/start?returnTo=%2Feastscape">Log in with Twitch</a></div>
    </div>
    <div class="cover soft" id="veil" hidden><div class="card" id="veilText"><span class="spin"></span>Connecting…</div></div>
  </section>
  <aside class="side" aria-label="Character">
    <div class="stats" id="stats"></div>
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="inv" aria-pressed="true" title="Inventory">🎒</button>
      <button type="button" data-tab="equip" aria-pressed="false" title="Equipment">🪖</button>
      <button type="button" data-tab="skills" aria-pressed="false" title="Skills">📶</button>
      <button type="button" data-tab="quests" aria-pressed="false" title="Quests">📜</button>
      <button type="button" data-tab="settings" aria-pressed="false" title="Settings">⚙️</button>
      <button type="button" data-tab="help" aria-pressed="false" title="How to play">❔</button>
      <button type="button" data-tab="admin" aria-pressed="false" title="Admin" hidden>🛠️</button>
    </nav>
    <div class="panel" id="panel"></div>
  </aside>
</main>
<script type="module">
import * as G from "/v3/assets/js/eastscape-shared.js?v=1";
const { ITEMS, SKILLS, QUESTS, MOBS, SCENES, XP_AT, DIRS, COLS, ROWS } = G;
const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const hashRand = G.hashRand;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ------------------------------------------------------------ the world is drawn small, then scaled up crisp */
const T = 16, W = COLS * T, H = ROWS * T;
const cv = $("cv"), ctx = cv.getContext("2d");
// kept on a 16-unit grid, drawn at art resolution (32px a tile) so PixelLab sprites land 1:1
const A = 2, low = document.createElement("canvas"); low.width = W * A; low.height = H * A;
const lc = low.getContext("2d"); lc.setTransform(A, 0, 0, A, 0, 0);
const px = (x, y, w, h, c) => { lc.fillStyle = c; lc.fillRect(Math.round(x), Math.round(y), w, h); };

/* ------------------------------------------------------------ what the server has told us */
let you = null;          // { id, login, name, admin }
let me = null;           // your character: hp, inv, eq, xp, qs, settings, scene, god
let offset = null;       // server clock minus ours
const snow = () => Date.now() + (offset || 0);
const Z = { key: "", g: null, objs: [], bg: null, mobs: [], npcs: [], bots: [], players: [], fadeAt: 0, defs: {} };
const set = (k) => (me?.settings?.[k] ?? G.DEFAULT_SETTINGS[k]);
const lvl = (k) => (me ? G.lvlOf(me, k) : 1);
const maxHp = () => (me ? G.maxHpOf(me) : 10);
const total = () => (me ? G.totalOf(me) : 0);
const myEnt = () => Z.players.find((p) => p.id === you?.id);

/* ------------------------------------------------------------ talking to the server */
const DEV = ["localhost", "127.0.0.1"].includes(location.hostname);
let ws = null, retry = 0, retryTimer = null, lastMsg = 0, everConnected = false, kicked = false, signedOut = false;
function net(state, text) { $("net").className = `net ${state}`; $("netText").textContent = text; }
function send(m) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(m)); }
async function connect() {
  clearTimeout(retryTimer);
  if (ws && ws.readyState <= 1) return;
  net("warn", everConnected ? "Reconnecting…" : "Connecting…");
  let url;
  try {
    if (DEV) url = `ws://${location.hostname}:8787/ws?dev=1&login=${encodeURIComponent(new URLSearchParams(location.search).get("as") || "bootypaper")}`;
    else {
      const r = await fetch("/api/eastscape/ticket", { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json" }, body: "{}" });
      if (r.status === 401) { signedOut = true; $("gate").hidden = false; $("veil").hidden = true; net("bad", "Not logged in"); return; }
      const j = await r.json(); if (!j.ok) throw new Error(j.message || "no ticket");
      url = `${j.ws}?ticket=${j.ticket}`;
    }
  } catch (e) { return later(); }
  ws = new WebSocket(url);
  ws.onmessage = (e) => { lastMsg = Date.now(); try { onMsg(JSON.parse(e.data)); } catch (err) { console.error(err); } };
  ws.onopen = () => { retry = 0; };
  ws.onclose = (e) => {
    ws = null;
    if (e.code === 4000) { kicked = true; net("bad", "Opened in another tab"); veil("This character is open in another tab. <br><br><button class='btn' id='takeBack'>Play here instead</button>"); $("takeBack")?.addEventListener("click", () => { kicked = false; connect(); }); return; }
    later();
  };
}
function later() {
  if (kicked) return;
  net("bad", "Reconnecting…");
  if (everConnected) veil('<span class="spin"></span>Connection lost. Reconnecting… your character is safe on the server.');
  const wait = Math.min(10000, 1000 * 2 ** retry++);
  retryTimer = setTimeout(connect, wait);
}
function veil(html) { if (html) { $("veilText").innerHTML = html; $("veil").hidden = false; } else $("veil").hidden = true; }
// coming back to the tab, or the network coming back: reconnect straight away
document.addEventListener("visibilitychange", () => { if (!document.hidden && !ws && !kicked && !signedOut) { retry = 0; connect(); } });
addEventListener("online", () => { if (!ws && !kicked && !signedOut) { retry = 0; connect(); } });
// a quiet socket is a dead socket: ping, and give up on it after 12 seconds of nothing
setInterval(() => { if (ws && ws.readyState === 1) { send({ t: "ping", c: Date.now() }); if (lastMsg && Date.now() - lastMsg > 12000) ws.close(); } }, 4000);

function onMsg(m) {
  if (m.type === "hello") {
    you = m.you; me = m.me; everConnected = true; veil(null); $("gate").hidden = true;
    $("topName").textContent = you.name;
    document.querySelector('[data-tab="admin"]').hidden = !you.admin;
    net("ok", "Connected"); renderPanel(); return;
  }
  if (m.type === "snap") {
    const est = m.t - Date.now(); offset = offset == null ? est : Math.max(offset - 5, Math.min(offset + 5, offset * 0.8 + est * 0.2));
    if (m.scene !== Z.key) loadScene(m.scene);
    Z.players = m.players; Z.mobs = m.mobs; Z.bots = m.bots;

      <div class="row"><button class="btn plain" data-a="clearxp">Clear this skill</button><button class="btn danger" data-a="clearall">Clear ALL xp</button></div>
    </fieldset>
    <fieldset><legend>Items</legend>
      <div class="row"><select id="aItem">${opts(items)}</select></div>
      <div class="row"><input type="number" id="aQty" value="1" min="1" aria-label="Quantity"><button class="btn" data-a="item">Give</button><button class="btn danger" data-a="clearinv">Clear inventory</button></div>
    </fieldset>
    <fieldset><legend>You</legend>
      <div class="row"><button class="btn" data-a="heal">Heal</button><button class="btn ${me.god ? "" : "plain"}" data-a="god">God mode: ${me.god ? "on" : "off"}</button></div>
      <div class="row"><select id="aScene">${opts(scenes)}</select><button class="btn" data-a="tp">Teleport</button></div>
      <div class="row"><button class="btn plain" data-a="resetscene">Reset this area</button><span class="tag">monsters, trees, rocks, bots</span></div>
    </fieldset>
    <fieldset><legend>Quests</legend>
      <div class="row"><select id="aQuest">${opts(quests)}</select></div>
      <div class="row"><select id="aQState"><option value="new">new</option><option value="active">active</option><option value="done">done</option></select><button class="btn" data-a="quest">Set</button><button class="btn plain" data-a="resetquests">Reset all</button></div>
    </fieldset>
    <fieldset><legend>Danger</legend>
      <div class="row"><button class="btn danger" data-a="reset">Reset my character</button></div>
    </fieldset>
    <details><summary class="tag">Raw character (what the server has)</summary><pre>${esc(JSON.stringify(me, null, 1))}</pre></details>
  </div>`;
  const v = (id) => $(id).value;
  const A2 = {
    xp: () => ({ cmd: "xp", skill: v("aSkill"), n: +v("aXp") }),
    setlvl: () => ({ cmd: "setlvl", skill: v("aSkill"), lvl: +v("aLvl") }),
    clearxp: () => ({ cmd: "clearxp", skill: v("aSkill") }),
    clearall: () => ({ cmd: "clearxp", skill: "all" }),
    item: () => ({ cmd: "item", k: v("aItem"), n: +v("aQty") }),
    clearinv: () => ({ cmd: "clearinv" }), heal: () => ({ cmd: "heal" }), god: () => ({ cmd: "god" }),
    tp: () => ({ cmd: "tp", scene: v("aScene") }), resetscene: () => ({ cmd: "resetscene" }),
    quest: () => ({ cmd: "quest", k: v("aQuest"), state: v("aQState") }), resetquests: () => ({ cmd: "resetquests" }),
    reset: () => ({ cmd: "reset" })
  };
  for (const [id, val] of keep) if ($(id)) $(id).value = val;
  p.querySelectorAll("[data-a]").forEach((b) => b.addEventListener("click", () => {
    const a = b.dataset.a, go = () => send({ t: "admin", ...A2[a]() });
    if (a === "reset" || a === "clearall" || a === "clearinv") return popup("Are you sure?", { reset: "Wipe your character back to a brand-new one?", clearall: "Clear the xp in every skill?", clearinv: "Empty your whole inventory?" }[a], "⚠️", [["Yes, do it", go], ["Cancel", null]]);
    go();
  }));
}
document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => { tab = b.dataset.tab; syncTabs(); renderPanel(); }));
window.__es = { get me() { return me; }, get you() { return you; }, Z, send, get ws() { return ws; } };

setInterval(() => {
  const d = new Date(); $("clock").textContent = d.toTimeString().slice(0, 8);
  if (ws && ws.readyState === 1 && you) {
    const ago = savedAt ? Math.round((Date.now() - savedAt) / 1000) : null;
    net("ok", ago == null ? "Connected" : ago < 5 ? "Saved just now" : `Saved ${ago < 60 ? `${ago}s` : `${Math.round(ago / 60)}m`} ago`);
  }
}, 1000);

artReady.then(() => { if (Z.key) Z.bg = paintBg(); });
requestAnimationFrame(frame);
veil('<span class="spin"></span>Connecting to the EastScape server…');
connect();
</script>
</body>
</html>
