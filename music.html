<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>EastCoin | The Green Room</title>
<link rel="canonical" href="https://eastcoin.vip/?view=music">
<script>
  /* The music room is part of the site shell now, so /music forwards to
     it. The hash is carried across; the old page had no query parameters
     worth keeping, and the shell would only ignore them.

     replace() rather than assign() so Back does not bounce straight
     back here. */
  (function () {
    window.location.replace("/?view=music" + window.location.hash);
  })();
</script>
</head>
<body>
<p>The Green Room has moved to <a href="/?view=music">eastcoin.vip</a>.</p>
</body>
</html>
