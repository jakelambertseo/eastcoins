<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
  <meta name="description" content="EastCoin private sports watch room with persistent Twitch chat." />
  <title>Live Player | EastCoin</title>

  <link rel="icon" type="image/png" href="assets/eastcoin-favicon.png" />
  <link rel="shortcut icon" href="assets/eastcoin-favicon.png" />
  <link rel="apple-touch-icon" href="assets/eastcoin-favicon.png" />

  <link rel="stylesheet" href="assets/eastcoins-theme.css?v=theme9" />
  <link rel="stylesheet" href="assets/eastcoins-ux.css?v=ux9" />
  <link rel="stylesheet" href="assets/eastcoins-shell.css?v=shell2" />
  <link rel="stylesheet" href="assets/eastcoins-persistent-shell.css?v=persistent1" />
</head>

<body class="ec-shell-page ec-persistent-shell">
  <div class="mobile-overlay" id="mobileOverlay" aria-hidden="true"></div>

  <div class="ec-persistent-layout" id="persistentLayout">
    <aside class="sidebar" id="persistentSidebar" aria-label="Primary navigation">
      <div class="brand">
        <div class="brand-mark brand-logo">
          <img src="assets/eastcoins-logo.webp" alt="EastCoin logo" />
        </div>
        <div class="brand-copy brand-copy-single">
          <strong>EastCoin</strong>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-label">EastCoin</div>
        <a
          class="nav-link active"
          href="index.html?view=player&amp;new=1"
          data-ec-shell-view="player">
          📺 Live Player
        </a>
        <a
          class="nav-link"
          href="index.html?view=events"
          data-ec-shell-view="events">
          🏟️ Events
        </a>
        <a class="nav-link" href="favorites.html" target="_top">⭐ Favorites</a>
        <details class="nav-games-menu">
          <summary class="nav-link nav-games-summary">
            <span class="nav-games-summary-copy">🎮 Games</span>
            <span class="nav-games-caret" aria-hidden="true">⌄</span>
          </summary>
          <div class="nav-games-submenu">
            <a class="nav-game-link" href="games.html?new=1" target="_top">All Games</a>
            <a class="nav-game-link" href="bonk.html" target="_top">🔨 Bonk</a>
            <a class="nav-game-link" href="aim-trainer.html?v=embedded1" target="_top">🎯 Aim Trainer</a>
            <a class="nav-game-link" href="button-masher.html?v=embedded1" target="_top">🟥 Button Masher</a>
          </div>
        </details>
      </div>

      <section
        class="football-countdown"
        data-football-countdown
        aria-label="Countdown to the 2026 NFL regular season">
        <div class="football-countdown-eyebrow">
          <span>🏈 NFL Kickoff</span>
          <span class="football-countdown-live">Countdown</span>
        </div>
        <p class="football-countdown-title">Football season starts in</p>
        <p class="football-countdown-matchup">Patriots at Seahawks</p>
        <div class="football-countdown-grid" aria-live="polite">
          <div class="football-countdown-unit">
            <span class="football-countdown-value" data-countdown-days>--</span>
            <span class="football-countdown-label">Days</span>
          </div>
          <div class="football-countdown-unit">
            <span class="football-countdown-value" data-countdown-hours>--</span>
            <span class="football-countdown-label">Hours</span>
          </div>
          <div class="football-countdown-unit">
            <span class="football-countdown-value" data-countdown-minutes>--</span>
            <span class="football-countdown-label">Min</span>
          </div>
          <div class="football-countdown-unit">
            <span class="football-countdown-value" data-countdown-seconds>--</span>
            <span class="football-countdown-label">Sec</span>
          </div>
        </div>
        <div class="football-countdown-date">Wed, Sep 9 · 7:20 PM CT</div>
      </section>

      <div class="zwades-callout" aria-label="Zwades Blue artwork">
        <span class="sr-only">blue</span>
      </div>

      <a
        class="sidebar-footer-link"
        href="index.html?view=emotes"
        data-ec-shell-view="emotes">
        🙂 Emote Help
      </a>
      <a class="sidebar-footer-link" href="status.html" target="_top">🟢 Status</a>
      <button class="sidebar-footer-link ec-settings-link" type="button">⚙ Settings</button>
    </aside>

    <main class="ec-persistent-view-area" aria-label="EastCoin content">
      <button
        class="mobile-menu"
        id="mobileMenu"
        type="button"
        aria-label="Hide navigation"
        aria-expanded="true">◀</button>

      <div class="ec-view-loader" id="viewLoader" aria-live="polite">
        <span class="ec-view-loader-spinner" aria-hidden="true"></span>
        <strong id="viewLoaderLabel">Loading Live Player</strong>
      </div>

      <iframe
        class="ec-view-frame"
        id="eastcoinViewFrame"
        title="EastCoin Live Player"
        src="player.html?shell=1"
        allow="autoplay; fullscreen; picture-in-picture; encrypted-media; clipboard-write"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </main>

    <div
      class="resize-handle"
      id="resizeHandle"
      role="separator"
      aria-label="Resize Twitch chat"
      aria-orientation="vertical"
      aria-valuemin="280"
      aria-valuenow="360"
      tabindex="0">
      <span aria-hidden="true"></span>
    </div>

    <aside class="chat-panel" id="persistentChat" aria-label="Twitch chat">
      <iframe
        class="twitch-chat-frame"
        id="persistentTwitchChat"
        src="https://www.twitch.tv/embed/zwades/chat?parent=eastcoins.pages.dev&amp;parent=eastcoin.vip&amp;parent=www.eastcoin.vip&amp;parent=localhost&amp;parent=127.0.0.1&amp;darkpopout"
        title="zwades Twitch chat"
        loading="eager"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/eastcoins-ux.js?v=ux9"></script>
  <script src="assets/eastcoins-persistent-shell.js?v=persistent2"></script>
</body>
</html>
