<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EastScape — mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<!-- A MOCKUP: a flat, scene-based mini MMO with the Gladiator character.
     Nothing is on a server; the other players are simulated. Saved in this
     browser only. -->
<style>
:root{--ink:#e8e0cc;--muted:#9a917e;--gold:#f2c94c;--panel:#f3e7cc;--panel-ink:#2a2016;--frame:#1a1410;--bar:#0b0908;--link-a:#7ee07e;--link-b:#e0e0e0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:"Nunito",system-ui,sans-serif;overflow:hidden}
button{font:inherit}
.top{height:32px;display:flex;align-items:center;gap:26px;padding:0 12px;background:var(--bar);border-bottom:2px solid #2a2118;font-size:15px;white-space:nowrap;overflow:hidden}
.top .logo{font-weight:700;color:#7ee07e;font-size:18px}
.top .me{color:#fff}
.top .clock{color:#fff;font-variant-numeric:tabular-nums}
.top a{color:var(--link-a);text-decoration:none}
.top a.w{color:var(--link-b)}
.top .online{color:#ffd23f}
.top .spacer{flex:1}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr);height:calc(100vh - 32px)}
/* the character panel sits on the LEFT: on the site, Twitch chat takes the right */
.wrap .side{order:-1;border-left:0;border-right:2px solid #2a2118}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:60vh auto;overflow:auto;height:auto}html,body{overflow:auto}}
.game{position:relative;background:#000;overflow:hidden;min-height:320px}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;cursor:pointer;touch-action:none}
.dbg{position:absolute;left:10px;top:8px;color:#ffe45c;font-size:13px;line-height:1.35;text-shadow:1px 1px 0 #000,0 0 3px #000;pointer-events:none;white-space:pre}
.dlg{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(620px,calc(100% - 24px));display:grid;grid-template-columns:84px 1fr;gap:12px;padding:12px 14px;background:var(--panel);color:var(--panel-ink);border:3px solid var(--frame);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:5}
.dlg[hidden]{display:none}
.game:has(.dlg:not([hidden])) .feed{bottom:190px}
.dlg-face{width:84px;height:84px;border:2px solid #8a7a5a;background:#d8cbac;display:grid;place-items:center;overflow:hidden;font-size:40px}
.dlg-face img{width:136px;height:136px;image-rendering:pixelated;object-fit:none;object-position:50% 28%;transform:scale(1)}
.dlg-body b{display:block;font-size:16px;color:#7a2a1a}
.dlg-body p{margin:4px 0 8px;font-size:15px;line-height:1.35}
.dlg-opts{display:grid;gap:4px}
.dlg-opts button{text-align:left;font:inherit;font-size:14px;font-weight:700;padding:5px 9px;border:1px solid #bfb193;background:#e6dcc4;color:#2a2016;border-radius:4px;cursor:pointer}
.dlg-opts button:hover,.dlg-opts button:focus-visible{background:#fff3c8;border-color:#8a7a5a;outline:none}
.dlg-opts button span{color:#7a2a1a;margin-right:4px}
.dlg-x{position:absolute;top:4px;right:6px;border:0;background:none;font-size:20px;line-height:1;cursor:pointer;color:#6a5a40}
.qdone{position:absolute;left:50%;top:84px;transform:translateX(-50%);text-align:center;padding:12px 28px;background:linear-gradient(#3a2a14,#1e160c);border:3px solid #e8bf35;border-radius:8px;color:#fff;box-shadow:0 0 30px rgba(232,191,53,.45);z-index:6;pointer-events:none}
.qdone[hidden]{display:none}
.qdone small{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#e8bf35;font-weight:800}
.qdone b{display:block;font-size:24px;margin:2px 0}
.qdone span{font-size:14px;color:#e8dcc0}
.qdone.show{animation:qpop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes qpop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.qdone.show{animation:none}}
.feed{position:absolute;left:10px;bottom:10px;width:min(520px,70%);display:flex;flex-direction:column;gap:2px;pointer-events:none}
.feed p{margin:0;align-self:flex-start;max-width:100%;padding:3px 9px;border-radius:3px;background:rgba(14,11,8,.72);font-size:14px;line-height:1.3;text-shadow:1px 1px 0 #000;animation:feedOut 9s linear forwards}
@keyframes feedOut{0%,80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.feed p{animation:none}}
.feed .sys{color:#e8e0cc}
.feed .good{color:#7ee07e}
.feed .loot{color:#ffd23f}
.feed .bad{color:#ff7a6a}
.feed .say b{color:#9fd0ff}
.feed .yell{color:#ffb86b}
.side{display:flex;flex-direction:column;background:#141010;border-left:2px solid #2a2118;min-height:0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:12px 14px;background:#0e0c0a;border-bottom:2px solid #2a2118}
.stat{display:flex;align-items:center;gap:10px;font-size:16px}
.stat i{font-style:normal;font-size:22px;width:28px;text-align:center}
.stat b{font-weight:600;font-variant-numeric:tabular-nums}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px}
.tabs button{height:44px;border:2px solid #000;border-radius:4px;background:linear-gradient(#5a5048,#3a322c);color:#fff;font-size:22px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tabs button[aria-pressed="true"]{background:linear-gradient(#f39ab5,#d9738f);outline:2px solid #fff2;outline-offset:-4px}
.tabs button:focus-visible{outline:2px solid var(--gold)}
.panel{flex:1;margin:0 8px 8px;background:var(--panel);color:var(--panel-ink);border:3px solid var(--frame);overflow:auto;min-height:0}
.ph{display:flex;justify-content:space-between;align-items:center;padding:5px 8px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:14px;border-bottom:2px solid rgba(0,0,0,.12)}
.ph small{font-weight:600;text-transform:none;color:#6a5a40}
.inv{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:6px}
.slot{position:relative;aspect-ratio:1;border:1px solid #bfb193;background:#e6dcc4;display:grid;place-items:center;font-size:26px;cursor:pointer;user-select:none}
.slot:hover{background:#efe6d0}
.slot.empty{cursor:default;background:#e2d8bf}
.slot.hint{outline:3px solid #ffb400;outline-offset:-3px;animation:hint .6s ease-in-out infinite alternate}
@keyframes hint{from{background:#e6dcc4}to{background:#ffe27a}}
@media (prefers-reduced-motion:reduce){.slot.hint{animation:none;background:#ffe27a}}
.slot em{position:absolute;left:2px;top:0;font-style:normal;font-size:12px;font-weight:700;color:#ff0;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000,1px 0 0 #000}
.doll{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(4,64px);gap:6px;justify-content:center;padding:14px 6px 8px;
  grid-template-areas:". helm ." "weapon body shield" ". legs ." "gloves boots ring"}
.eq{border:2px solid #8a7a5a;border-radius:4px;background:#d8cbac;display:grid;place-items:center;font-size:30px;position:relative;cursor:pointer;font-family:inherit;color:inherit;padding:0}
.eq:hover:not(:disabled){background:#e6dcc4}
.eq:disabled{cursor:default}
.eq small{position:absolute;bottom:1px;left:0;right:0;text-align:center;font-size:10px;color:#5a4a30}
.eq.empty{opacity:.55;font-size:22px;filter:grayscale(1)}
.bonl{margin:4px 8px 8px;border:2px solid #8a7a5a;background:#e6dcc4}
.bonl .bh{padding:4px 8px;font-size:13px;color:#5a4a30;border-bottom:2px solid #bfb193}
.bonl div:not(.bh){display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:center;padding:4px 8px;font-size:13px;border-bottom:1px solid #d0c4a8}
.bonl i{font-style:normal;text-align:center}
.bon{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;padding:6px 14px 12px;font-size:14px}
.bon span{display:flex;justify-content:space-between}
.sk{display:grid;gap:6px;padding:8px}
.skr{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:6px 8px;background:#e6dcc4;border:1px solid #bfb193}
.skr i{font-style:normal;font-size:22px;text-align:center}
.skr b{display:block;font-size:15px}
.skr small{display:block;font-size:12px;color:#6a5a40}
.skr .lv{font-size:20px;font-weight:700;color:#2a6a1a}
.xpb{height:6px;background:#bfb193;margin-top:3px}
.xpb i{display:block;height:100%;background:#3f9a2e}
.qs{display:grid;gap:6px;padding:8px}
.q{padding:8px 10px;background:#e6dcc4;border:1px solid #bfb193}
.q b{display:block;font-size:15px}
.q small{display:block;font-size:13px;color:#6a5a40}
.q.done b{color:#2a6a1a}
.q .qtag{display:inline-block;font-style:normal;font-size:11px;font-weight:800;padding:1px 6px;border-radius:3px;background:#d0c4a8;color:#5a4a30;margin:2px 0 3px}
.q.ready .qtag{background:#ffd23f;color:#3a2a00}
.q.active .qtag{background:#9fd07a;color:#1a3a0a}
.q.done{opacity:.75}
.q.locked{opacity:.5}
.note{padding:8px 12px;font-size:13px;color:#6a5a40}
.bottomtabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:0 8px 8px}
</style>
</head>
<body>
<header class="top">
  <span class="logo">⚔ EastScape</span>
  <span class="me" id="topName">bootypaper</span>
  <span class="clock" id="clock">--:--:--</span>
  <a href="#" title="Mockup">Purchases</a><a href="#" class="w" title="Mockup">Hiscores</a><a href="#" class="w" title="Mockup">WIKI</a><a href="#" class="w" title="Mockup">Updates</a>
  <span class="spacer"></span>
  <span class="online" id="online">— players</span>
</header>
<main class="wrap">
  <section class="game" aria-label="Game">
    <canvas id="cv"></canvas>
    <div class="dbg" id="dbg"></div>
    <!-- no in-game chat: the game sits beside the site's Twitch chat. This is only the game's own messages. -->
    <div class="feed" id="log" aria-live="polite"></div>
    <div class="dlg" id="dlg" role="dialog" aria-label="Conversation" hidden>
      <div class="dlg-face" id="dlgFace"></div>
      <div class="dlg-body"><b id="dlgName"></b><p id="dlgText"></p><div class="dlg-opts" id="dlgOpts"></div></div>
      <button type="button" class="dlg-x" id="dlgX" aria-label="Close">×</button>
    </div>
    <div class="qdone" id="qdone" hidden></div>
  </section>
  <aside class="side" aria-label="Character">
    <div class="stats" id="stats"></div>
    <nav class="tabs" role="tablist">
      <button type="button" data-tab="inv" aria-pressed="true" title="Inventory">🎒</button>
      <button type="button" data-tab="equip" aria-pressed="false" title="Equipment">🪖</button>
      <button type="button" data-tab="skills" aria-pressed="false" title="Skills">📶</button>
      <button type="button" data-tab="quests" aria-pressed="false" title="Quests">📜</button>
      <button type="button" data-tab="help" aria-pressed="false" title="How to play">❔</button>
    </nav>
    <div class="panel" id="panel"></div>
  </aside>
</main>
<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = (a) => a[Math.floor(Math.random() * a.length)];

  /* ------------------------------------------------------------ the world is drawn small, then scaled up crisp */
  const T = 16, COLS = 22, ROWS = 13, W = COLS * T, H = ROWS * T;
  const cv = $("cv"), ctx = cv.getContext("2d");
  // the world is kept on a 16-unit grid; it is drawn at art resolution, 32px a tile,
  // so PixelLab sprites land 1:1 and the procedural bits are drawn at 2x
  const A = 2, low = document.createElement("canvas"); low.width = W * A; low.height = H * A;
  const lc = low.getContext("2d"); lc.setTransform(A, 0, 0, A, 0, 0);
  const px = (x, y, w, h, c) => { lc.fillStyle = c; lc.fillRect(Math.round(x), Math.round(y), w, h); };
  function hashRand(x, y, s = 1) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

  /* ------------------------------------------------------------ OSRS curve */
  const XP_AT = [0, 0];
  { let p = 0; for (let l = 1; l < 99; l++) { p += Math.floor(l + 300 * Math.pow(2, l / 7)); XP_AT[l + 1] = Math.floor(p / 4); } }
  const levelOf = (xp) => { let l = 1; while (l < 99 && xp >= XP_AT[l + 1]) l++; return l; };

  /* ------------------------------------------------------------ things you can carry */
  const ITEMS = {
    coins: { name: "Denarii", icon: "🪙" }, wheat: { name: "Wheat", icon: "🌾" }, bones: { name: "Bones", icon: "🦴" },
    beef: { name: "Raw beef", icon: "🥩" }, hide: { name: "Cowhide", icon: "🟫" }, chicken: { name: "Raw chicken", icon: "🍗" },
    feather: { name: "Feather", icon: "🪶" }, sardine: { name: "Raw sardine", icon: "🐟" }, trout: { name: "Raw trout", icon: "🐠" },
    copper: { name: "Copper ore", icon: "🟠" }, tin: { name: "Tin ore", icon: "⚪" }, logs: { name: "Logs", icon: "🪵" }, olives: { name: "Olives", icon: "🫒" },
    pork: { name: "Raw boar", icon: "🥓" },
    yewlogs: { name: "Ancient yew logs", icon: "🪵", ex: "Heavy, dark and faintly warm. The grain moves if you stare." },
    mooncarp: { name: "Raw moon carp", icon: "🐡", ex: "It's looking at you. It's always looking at you." },
    stardust: { name: "Stardust", icon: "✨", ex: "Warm, and humming a note you almost recognise." },
    sunolive: { name: "Sun olive", icon: "🫒", ex: "Glows in the dark. Tastes like a summer you never had." }, tusk: { name: "Boar tusk", icon: "🦷" },
    pit: { name: "Olive pit", icon: "🌰", ex: "It's still warm. And still angry." },
    monocle: { name: "Tiny monocle", icon: "🧐", ex: "The olive was wearing it. You feel slightly more distinguished just holding it." },
    manifesto: { name: "Goat's manifesto", icon: "📜", ex: "Mostly bleats. Page three is surprisingly moving." },
    // things you wear: a slot, and what they add. Tools go in the weapon hand and must be held to use.
    rudis: { name: "Wooden rudis", short: "Rudis", icon: "🗡️", slot: "weapon", acc: 4, str: 2 },
    pickaxe: { name: "Bronze pickaxe", short: "Pickaxe", icon: "⛏️", slot: "weapon", tool: "mining", acc: 1, str: 1 },
    axe: { name: "Bronze axe", short: "Axe", icon: "🪓", slot: "weapon", tool: "woodcutting", acc: 2, str: 2 },
    rod: { name: "Fishing rod", short: "Rod", icon: "🎣", slot: "weapon", tool: "fishing" },
    cap: { name: "Leather cap", short: "Cap", icon: "⛑️", slot: "helm", def: 1 },
    tunic: { name: "Tunic", icon: "🥋", slot: "body", def: 2 },
    toga: { name: "Goat-sized toga", short: "Toga", icon: "🥻", slot: "body", def: 3, acc: 1, ex: "Smells of goat. Fits you perfectly, which is worrying." },
    parma: { name: "Parma", icon: "🛡️", slot: "shield", def: 3 },
    sandals: { name: "Sandals", icon: "🩴", slot: "boots", def: 1 }
  };
  const SKILLS = { melee: { name: "Melee", icon: "⚔️" }, hp: { name: "Hitpoints", icon: "❤️" }, fishing: { name: "Fishing", icon: "🎣" }, farming: { name: "Harvesting", icon: "🌾" }, mining: { name: "Mining", icon: "⛏️" }, woodcutting: { name: "Woodcutting", icon: "🪓" } };

  /* ------------------------------------------------------------ state, saved in this browser */
  const SAVE = "ec_glad_flat_v1";
  // you start with your tools in your bag, not in your hand: wielding them is the first lesson
  const fresh = () => ({ scene: "farm", x: 11, y: 7, hp: 10, inv: [{ k: "coins", n: 25 }, { k: "pickaxe", n: 1 }, { k: "axe", n: 1 }, { k: "rod", n: 1 }],
    eq: { weapon: "rudis", helm: "cap", body: "tunic", shield: "parma", boots: "sandals", legs: null, gloves: null, ring: null },
    xp: { melee: 0, hp: XP_AT[10], fishing: 0, farming: 0, mining: 0, woodcutting: 0 }, q: { cows: 0, fish: 0, ore: 0, logs: 0, done: {} } });
  let S = fresh();
  try {
    const o = JSON.parse(localStorage.getItem(SAVE) || "null");
    if (o) {
      S = { ...fresh(), ...o, xp: { ...fresh().xp, ...o.xp }, q: { ...fresh().q, ...o.q } };
      // a save from before tools existed gets the starting kit
      if (!o.eq) for (const k of ["pickaxe", "axe", "rod"]) if (!S.inv.some((x) => x.k === k)) S.inv.push({ k, n: 1 });
    }
  } catch (e) { /* fresh */ }
  const save = () => { try { localStorage.setItem(SAVE, JSON.stringify(S)); } catch (e) { /* private window */ } };
  const lvl = (k) => levelOf(S.xp[k]);
  const maxHp = () => lvl("hp");
  const combat = () => Math.floor((lvl("melee") * 1.3 + lvl("hp")) / 2.3) + 2;
  const total = () => Object.keys(SKILLS).reduce((n, k) => n + lvl(k), 0);
  const invCount = () => S.inv.length;
  function give(k, n = 1) {
    const s = S.inv.find((x) => x.k === k);
    if (s) { s.n += n; return true; }
    if (S.inv.length >= 30) { say("Your inventory is full.", "bad"); return false; }
    S.inv.push({ k, n }); return true;
  }
  const xpDrops = [];
  let tracker = null;   // { k, at }: the skill last trained, drawn as a ring at the top of the game
  // what your gear adds, and the tool check every skill makes
  const bon = () => { const b = { acc: 0, str: 0, def: 0 }; for (const k of Object.values(S.eq)) if (k && ITEMS[k]) for (const q in b) b[q] += ITEMS[k][q] || 0; return b; };
  const TOOL_OF = { mining: "pickaxe", woodcutting: "axe", fishing: "rod" };
  let hintSlot = null;
  function hasTool(skill) {
    const w = S.eq.weapon; if (w && ITEMS[w].tool === skill) return true;
    const k = TOOL_OF[skill], nm = ITEMS[k].name.toLowerCase();
    if (!S.inv.some((x) => x.k === k)) { say(`You need a ${nm} to do that.`, "bad"); return false; }
    say(`You need to hold your ${nm} first. Click it in your inventory to wield it.`, "bad");
    hintSlot = { k, until: performance.now() + 8000 }; tab = "inv"; syncTabs(); renderPanel(); setTimeout(renderPanel, 8100);
    return false;
  }
  function equip(i) {
    const st = S.inv[i], it = ITEMS[st.k]; if (!it.slot) return;
    const old = S.eq[it.slot];
    if (st.n > 1) st.n--; else S.inv.splice(i, 1);
    if (old) give(old);
    S.eq[it.slot] = st.k;
    say(`You ${it.slot === "weapon" ? "wield" : "put on"} the ${it.name.toLowerCase()}.`, "sys");
    if (hintSlot && hintSlot.k === st.k) hintSlot = null;
    save(); renderPanel();
  }
  function unequip(slot) {
    const k = S.eq[slot]; if (!k) return;
    if (!give(k)) return;
    S.eq[slot] = null; say(`You take off the ${ITEMS[k].name.toLowerCase()}.`, "sys"); save(); renderPanel();
  }
  function grant(k, xp, track = true) {
    const before = lvl(k); S.xp[k] += xp; const after = lvl(k);
    xpDrops.push({ k, xp, at: performance.now() });
    if (track) tracker = { k, at: performance.now() };
    if (after > before) { say(`Congratulations, you just advanced a ${SKILLS[k].name} level! You are now level ${after}.`, "good"); if (k === "hp") S.hp = Math.min(maxHp(), S.hp + 1); }
  }

  /* ------------------------------------------------------------ chat */
  function say(text, cls = "sys", who) {
    const p = document.createElement("p"); p.className = cls;
    if (who) { const b = document.createElement("b"); b.textContent = `${who}: `; p.append(b); p.append(document.createTextNode(text)); } else p.textContent = text;
    const log = $("log"); log.append(p); while (log.children.length > 4) log.firstChild.remove();
    setTimeout(() => p.remove(), 9000);
  }

  /* ------------------------------------------------------------ the two scenes
     grid: . grass  , path  ~ water  s sand  # blocked-by-object  e exit (blue) */
  // the fence (or wall) round a scene, with a 3-tile gap for each exit; exits sit mid-side
  const SPAN = { n: [16, 18], s: [16, 18], e: [5, 7], w: [5, 7] }, OPP = { n: "s", s: "n", e: "w", w: "e" };
  const grid = (fill = ".") => Array.from({ length: ROWS }, () => Array(COLS).fill(fill));
  const block = (g, x, y, w = 1, h = 1) => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) g[j][i] = "#"; };
  function border(g, objs, exits, open = () => false, wall = false) {
    const fh = wall ? "wallH" : "fenceH", fv = wall ? "wallV" : "fenceV";
    for (let x = 0; x < COLS; x++) for (const [y, d] of [[0, "n"], [ROWS - 1, "s"]]) {
      if (open(x, y)) continue;
      if (exits[d] && x >= SPAN[d][0] && x <= SPAN[d][1]) g[y][x] = "e"; else { g[y][x] = "#"; objs.push({ t: fh, x, y }); }

    if (clickMark && now - clickMark.at < 500) { const k = (now - clickMark.at) / 500; ctx.strokeStyle = clickMark.red ? `rgba(255,60,40,${1 - k})` : `rgba(255,230,80,${1 - k})`; ctx.lineWidth = 3; const c = { x: sx(clickMark.x * T + 8), y: sy(clickMark.y * T + 8) }; ctx.beginPath(); ctx.moveTo(c.x - 8 - k * 4, c.y - 8 - k * 4); ctx.lineTo(c.x + 8 + k * 4, c.y + 8 + k * 4); ctx.moveTo(c.x + 8 + k * 4, c.y - 8 - k * 4); ctx.lineTo(c.x - 8 - k * 4, c.y + 8 + k * 4); ctx.stroke(); }

    // your gladiator (the only thing drawn at screen scale, from the PixelLab sheet)
    const hx = sx(P.px * T + 8), hy = sy(P.py * T + 15), fighting = P.act?.kind === "mob" && !moving && !P.path.length;
    if (!IMG.hero_south && hero.complete && hero.naturalWidth) {
      const heightPx = 27 * S2, sc = heightPx / SHEET.body;
      let row = "idle", fr;
      if (moving) { row = "run"; fr = Math.floor(now / 85) % 6; }
      else if (fighting && now - P.swingAt < 420) { row = "attack"; fr = Math.min(5, Math.floor((now - P.swingAt) / 70)); }
      else fr = Math.floor(now / 150) % 6;
      const [r] = SHEET.rows[row];
      ctx.save(); ctx.translate(Math.round(hx), Math.round(hy)); if (P.face < 0) ctx.scale(-1, 1);
      ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.beginPath(); ctx.ellipse(0, 0, 7 * S2, 2 * S2, 0, 0, Math.PI * 2); ctx.fill();
      ctx.imageSmoothingEnabled = sc < 1;
      if (now - P.hurtAt < 200) ctx.filter = "brightness(1.6) sepia(1) saturate(4) hue-rotate(-30deg)";
      ctx.drawImage(hero, fr * SHEET.fw, r * SHEET.fh, SHEET.fw, SHEET.fh, -SHEET.fw * sc / 2, -SHEET.foot * sc, SHEET.fw * sc, SHEET.fh * sc);
      ctx.restore();
    }
    // what's in your hand, until the art has tools: the sword is already in the sprite
    if (IMG.hero_south && S.eq.weapon && S.eq.weapon !== "rudis" && P.dir !== "north") {
      const west = (P.dir || "").includes("west");
      ctx.save(); ctx.translate(hx + (west ? -9 : 9) * S2, hy - 10 * S2); if (west) ctx.scale(-1, 1);
      ctx.font = `${Math.round(8 * S2)}px sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(ITEMS[S.eq.weapon].icon, 0, 0); ctx.restore();
    }
    // names under everyone, like the real thing
    label("bootypaper", hx, hy + 4, "#fff"); label(`level ${total()}`, hx, hy + 18, "#ffe45c", 12);
    for (const m of Z.mobs) if (!m.dead) {
      const x = sx(m.px * T + 8), y = sy(m.py * T + 15); label(MOBS[m.t].name, x, y + 2, "#ffb23f", 12);
      if (m.hp < MOBS[m.t].hp) { const bw = 30; ctx.fillStyle = "#c00"; ctx.fillRect(x - bw / 2, sy(m.py * T - 5), bw, 5); ctx.fillStyle = "#0c0"; ctx.fillRect(x - bw / 2, sy(m.py * T - 5), bw * Math.max(0, m.hp / MOBS[m.t].hp), 5); }
    }
    for (const n of Z.npcs) {
      const k = npcQuest(n), st = k && qState(k);
      if (st === "new" || st === "ready") {
        const ax = sx(n.px * T + 8), ay = sy(n.py * T - 13) + Math.sin(now / 220) * 4, a = 0.55 + 0.45 * Math.abs(Math.sin(now / 300)), r = 9;
        ctx.globalAlpha = a; ctx.beginPath(); ctx.moveTo(ax - r, ay - r * 1.2); ctx.lineTo(ax + r, ay - r * 1.2); ctx.lineTo(ax, ay + r * 0.6); ctx.closePath();
        ctx.fillStyle = st === "ready" ? "#ffd23f" : "#ff2a2a"; ctx.fill(); ctx.lineWidth = 2.5; ctx.strokeStyle = "#fff"; ctx.stroke();
        ctx.fillStyle = st === "ready" ? "#ffd23f" : "#ff2a2a"; ctx.fillRect(ax - r * 0.4, ay - r * 2.3, r * 0.8, r * 1.2); ctx.strokeRect(ax - r * 0.4, ay - r * 2.3, r * 0.8, r * 1.1);
        ctx.globalAlpha = 1;
      }
    }
    for (const n of Z.npcs) { const x = sx(n.px * T + 8), y = sy(n.py * T + 15); label(n.name, x, y + 2, "#fff", 12); if (n.bubble && now - n.bubble.at < 3500) bubble(n.bubble.text, x, sy(n.py * T - 10)); }
    for (const b of Z.bots) { const x = sx(b.px * T + 8), y = sy(b.py * T + 15); label(b.name, x, y + 2, "#fff", 12); label(`level ${b.level}`, x, y + 15, "#ffe45c", 11); if (b.bubble && now - b.bubble.at < 3500) bubble(b.bubble.text, x, sy(b.py * T - 10)); }
    if (fighting && S.hp < maxHp()) { ctx.fillStyle = "#c00"; ctx.fillRect(hx - 18, hy - 29 * S2, 36, 5); ctx.fillStyle = "#0c0"; ctx.fillRect(hx - 18, hy - 29 * S2, 36 * Math.max(0, S.hp / maxHp()), 5); }
    // hit splats
    splats = splats.filter((s) => now - s.at < 900);
    for (const s of splats) {
      let x, y;
      if (s.who === "you") { x = hx; y = hy - 18 * S2; } else { const m = Z.mobs.find((q) => q.id === s.who); if (!m) continue; x = sx(m.px * T + 8); y = sy(m.py * T) - 2 * S2; }
      const k = (now - s.at) / 900; ctx.globalAlpha = Math.min(1, (1 - k) * 2.5);
      ctx.fillStyle = s.kind === "miss" ? "#2f6fd6" : "#c42a2a"; ctx.beginPath(); ctx.arc(x, y - k * 10, 11, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#000"; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = "#fff"; ctx.font = `700 13px "Nunito", system-ui, sans-serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(String(s.n), x, y - k * 10 + 1);
      ctx.globalAlpha = 1;
    }
    // xp drops: rise off your head and fade, a few stacked if they land together
    for (let i = xpDrops.length - 1; i >= 0; i--) if (now - xpDrops[i].at > 1600) xpDrops.splice(i, 1);
    xpDrops.forEach((d, i) => {
      const k = (now - d.at) / 1600, y = hy - 31 * S2 - k * 34 - (xpDrops.length - 1 - i) * 16;
      ctx.globalAlpha = Math.min(1, (1 - k) * 2.2);
      ctx.font = `700 15px "Nunito", system-ui, sans-serif`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
      const t = `+${d.xp} xp`, tw = ctx.measureText(t).width, x = hx - (tw + 20) / 2;
      ctx.font = "13px sans-serif"; ctx.fillText(SKILLS[d.k].icon, x, y);
      ctx.font = `700 15px "Nunito", system-ui, sans-serif`; ctx.lineWidth = 3; ctx.strokeStyle = "#0a1a08"; ctx.strokeText(t, x + 19, y); ctx.fillStyle = "#5dff4a"; ctx.fillText(t, x + 19, y);
      ctx.globalAlpha = 1;
    });
    // the skill ring: progress to the next level, up while you work and for a few seconds after
    if (tracker) {
      const busy = P.act && ["mob", "spot", "wheat", "rock", "vein", "tree", "olive"].includes(P.act.kind), idle = now - tracker.at;
      if (busy) tracker.at = Math.max(tracker.at, now - 3000);
      const a = busy ? 1 : Math.max(0, 1 - (idle - 5000) / 800);
      if (a <= 0) tracker = null;
      else {
        const k = tracker.k, l = lvl(k), lo = XP_AT[l], hi = XP_AT[Math.min(99, l + 1)], f = l >= 99 ? 1 : (S.xp[k] - lo) / (hi - lo);
        const cx = w / 2, cy = 52, r = 22;
        ctx.globalAlpha = a;
        ctx.fillStyle = "rgba(20,24,20,.82)"; ctx.beginPath(); ctx.arc(cx, cy, r + 4, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
        ctx.strokeStyle = "#f2d22e"; ctx.lineCap = "round"; ctx.beginPath(); ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0.02, f)); ctx.stroke(); ctx.lineCap = "butt";
        ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(SKILLS[k].icon, cx, cy + 1);
        ctx.font = `700 12px "Nunito", system-ui, sans-serif`; ctx.lineWidth = 3; ctx.strokeStyle = "#000"; ctx.strokeText(String(l), cx + r - 2, cy + r - 4); ctx.fillStyle = "#fff"; ctx.fillText(String(l), cx + r - 2, cy + r - 4);
        ctx.globalAlpha = 1;
      }
    }
    if (hoverThing) {
      const rq = hoverThing.ob?.req, low = rq && lvl(rq.skill) < rq.lvl;
      label(`${VERB[hoverThing.kind] || "Examine"} ${hoverThing.name}${rq ? ` (${SKILLS[rq.skill].name} ${rq.lvl})` : ""}`, w / 2, 8, low ? "#ff8a7a" : "#fff", 14);
    }
    // a scene change fades in
    const fk = (now - Z.fadeAt) / 350; if (fk < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - fk})`; ctx.fillRect(0, 0, w, h); }
    $("dbg").textContent = `Town: ${SCENES[Z.key].name}\nPlayer: bootypaper · level ${total()}\nTile: ${P.x} ${P.y}${hoverTile ? `   Mouse: ${hoverTile.x} ${hoverTile.y}` : ""}\nAction: ${P.act ? (P.act.kind === "mob" ? `fighting ${P.act.name}` : P.act.kind === "spot" ? "fishing" : P.act.kind === "wheat" ? "picking wheat" : P.act.kind) : moving ? "walking" : "none"}`;
    requestAnimationFrame(frame);
  }

  /* ------------------------------------------------------------ the right-hand panel */
  let tab = "inv";
  const syncTabs = () => document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.tab === tab)));
  function renderStats() {
    $("stats").innerHTML = [
      ["❤️", `${Math.max(0, S.hp)}/${maxHp()}`, "Hitpoints"], ["⚔️", combat(), "Combat level"],
      ["⭐", total(), "Total level"], ["🪙", (S.inv.find((x) => x.k === "coins")?.n || 0).toLocaleString(), "Denarii"],
      ["🎒", `${invCount()}/30`, "Inventory"], ["🏛️", Z.key ? SCENES[Z.key].name.replace(/^The /, "").split(" ")[0] : "", "Area"]
    ].map(([i, v, t]) => `<div class="stat" title="${t}"><i>${i}</i><b>${v}</b></div>`).join("");
  }
  function renderPanel() {
    questCheck();
    renderStats();
    const p = $("panel");
    if (tab === "inv") {
      const hint = hintSlot && hintSlot.until > performance.now() ? hintSlot.k : null;
      const cells = S.inv.map((s, i) => `<div class="slot${s.k === hint ? " hint" : ""}${ITEMS[s.k].slot ? " gear" : ""}" data-i="${i}" title="${ITEMS[s.k].name}${s.n > 1 ? ` ×${s.n.toLocaleString()}` : ""} — ${ITEMS[s.k].slot ? (ITEMS[s.k].slot === "weapon" ? "click to wield" : "click to wear") : "click to examine"}, shift-click to drop">${ITEMS[s.k].icon}${s.n > 1 ? `<em>${s.n >= 100000 ? Math.floor(s.n / 1000) + "k" : s.n.toLocaleString()}</em>` : ""}</div>`);
      while (cells.length < 30) cells.push('<div class="slot empty"></div>');
      p.innerHTML = `<div class="ph">Inventory <small>${invCount()}/30</small></div><div class="inv">${cells.join("")}</div>`;
      p.querySelectorAll(".slot[data-i]").forEach((el) => el.addEventListener("click", (e) => {
        const s = S.inv[+el.dataset.i]; if (!s) return;
        if (e.shiftKey) { if (s.k === "coins") return say("You'd rather not drop your denarii.", "sys"); S.inv.splice(+el.dataset.i, 1); say(`You drop the ${ITEMS[s.k].name.toLowerCase()}.`, "sys"); save(); renderPanel(); }
        else if (ITEMS[s.k].slot) equip(+el.dataset.i);
        else say(`${ITEMS[s.k].name}${s.n > 1 ? ` (×${s.n.toLocaleString()})` : ""}.${ITEMS[s.k].ex ? " " + ITEMS[s.k].ex : ""}`, "sys");
      }));
    }
    if (tab === "equip") {
      const EMPTY = { helm: "⛑️", weapon: "🗡️", body: "🥋", shield: "🛡️", legs: "👖", gloves: "🧤", boots: "🥾", ring: "💍" };
      const slot = (area) => { const k = S.eq[area], it = k && ITEMS[k]; return `<button type="button" class="eq${it ? "" : " empty"}" data-slot="${area}" style="grid-area:${area}" title="${it ? `${it.name} — click to take off` : `${area}: empty`}"${it ? "" : " disabled"}>${it ? it.icon : EMPTY[area]}<small>${it ? it.short || it.name : ""}</small></button>`; };
      const b = bon(), tool = S.eq.weapon && ITEMS[S.eq.weapon].tool;
      p.innerHTML = `<div class="ph">Equipment <small>paper doll</small></div><div class="doll">${["helm", "weapon", "body", "shield", "legs", "gloves", "boots", "ring"].map(slot).join("")}</div>
        <div class="bonl"><div class="bh">${S.eq.weapon ? `${ITEMS[S.eq.weapon].icon} ${ITEMS[S.eq.weapon].name}` : "✊ Unarmed"}${tool ? ` · lets you train ${SKILLS[tool].name}` : ""}</div>
          <div><i>⊕</i><span>accuracy</span><b>+${b.acc}</b></div><div><i>🔺</i><span>strength</span><b>+${b.str}</b></div>
          <div><i>🎯</i><span>max hit</span><b>${maxHit()}</b></div><div><i>🛡️</i><span>defence</span><b>+${b.def}</b></div></div>
        <p class="note">Click something you're wearing to take it off. Tools go in your weapon hand: hold the pickaxe to mine, the axe to chop, the rod to fish.</p>`;
      p.querySelectorAll(".eq[data-slot]").forEach((el) => el.addEventListener("click", () => unequip(el.dataset.slot)));
    }
    if (tab === "skills") {
      p.innerHTML = `<div class="ph">Skills <small>total ${total()}</small></div><div class="sk">${Object.entries(SKILLS).map(([k, s]) => {
        const L = lvl(k), lo = XP_AT[L], hi = XP_AT[Math.min(99, L + 1)], pc = L >= 99 ? 100 : Math.floor((S.xp[k] - lo) / (hi - lo) * 100);
        return `<div class="skr"><i>${s.icon}</i><span><b>${s.name}</b><small>${S.xp[k].toLocaleString()} xp · ${L >= 99 ? "max" : `${(hi - S.xp[k]).toLocaleString()} to go`}</small><div class="xpb"><i style="width:${pc}%"></i></div></span><span class="lv">${L}</span></div>`;
      }).join("")}</div>`;
    }
    if (tab === "quests") {
      const order = { ready: 0, active: 1, new: 2, done: 3, locked: 4 }, keys = Object.keys(QUESTS).sort((a, b) => order[qState(a)] - order[qState(b)]);
      const done = keys.filter((k) => qState(k) === "done").length;
      p.innerHTML = `<div class="ph">Quests <small>${done}/${keys.length} done</small></div><div class="qs">${keys.map((k) => {
        const q = QUESTS[k], st = qState(k), have = Math.min(qHave(q, k), q.goal.n);
        const line = st === "new" ? `Talk to ${q.giver} at ${q.where}.` : st === "locked" ? "Finish an earlier quest to unlock this." : st === "done" ? `Reward: ${q.reward.text}` : q.brief;
        const tag = { new: "Not started", active: "In progress", ready: `Hand in to ${q.giver}`, done: "Done", locked: "Locked" }[st];
        return `<div class="q ${st}"><b>${q.icon} ${q.name}</b><em class="qtag">${tag}</em><small>${line}</small>${st === "active" || st === "ready" ? `<div class="xpb"><i style="width:${(have / q.goal.n) * 100}%"></i></div><small>${have}/${q.goal.n} ${q.goal.what}</small>` : ""}</div>`;
      }).join("")}</div>`;
    }
    if (tab === "help") {
      p.innerHTML = `<div class="ph">How to play</div><div class="note">
        <p><b>Walk:</b> click the ground, or WASD / arrow keys.</p>
        <p><b>Fight:</b> click a cow or a chicken.</p>
        <p><b>Talk:</b> click a person.</p>
        <p><b>Tools:</b> your pickaxe, axe and fishing rod start in your bag. Click one to wield it; you have to be holding the right one to mine, chop or fish. Click your sword to fight properly again.</p>
        <p><b>Gather:</b> click wheat or an olive tree to pick it, a rock to mine it (the big vein keeps going on its own), a tree to chop it, the bubbling water to fish.</p>
        <p><b>Travel:</b> walk onto the blue tiles at the edge to reach the next area.</p>
        <p><b>Chat:</b> use the Twitch chat beside the game.</p>
        <p>This is a mockup: the other players are simulated, and it saves in this browser only.</p></div>`;
    }
  }
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
    tab = b.dataset.tab; syncTabs(); renderPanel();
  }));

  /* ------------------------------------------------------------ the rest of the "server" */
  const BOT_LINES = ["anyone know where the good fishing is?", "gz", "cows are free xp lol", "selling feathers", "this farm is peaceful", "wheat run anyone?", "brb"];
  setInterval(() => {
    if (Math.random() < 0.35 && Z.bots.length) { const b = pick(Z.bots), line = pick(BOT_LINES); b.bubble = { text: line, at: performance.now() }; }
    else if (Math.random() < 0.15) say(`[server] ${pick(["Crixus", "Varro", "Gannicus", "Naevia", "Agron"])} has reached level ${rint(20, 90)} in ${pick(["Melee", "Fishing", "Harvesting"])}!`, "yell");
  }, 9000);
  let online = rint(40, 70);
  setInterval(() => {
    const d = new Date(); $("clock").textContent = d.toTimeString().slice(0, 8);
    if (Math.random() < 0.2) online = Math.max(20, online + rint(-2, 2));
    $("online").textContent = `${online} players`;
    renderStats();
  }, 1000);
  setInterval(save, 5000);
  addEventListener("pagehide", save);

  loadScene(S.scene in SCENES ? S.scene : "farm");
  artReady.then(() => { Z.bg = paintBg(); });
  Object.assign(P, { x: S.x, y: S.y, px: S.x, py: S.y });
  if (!walkable(P.x, P.y) || Z.g[P.y][P.x] === "e") Object.assign(P, { x: 11, y: 7, px: 11, py: 7 });
  say("Welcome to EastScape. Your pickaxe, axe and fishing rod are in your bag: click one to wield it before you mine, chop or fish. Blue tiles lead on.", "sys");
  renderPanel();
  requestAnimationFrame(frame);
  window.__flat = { get S() { return S; }, P, Z, loadScene, grant, interact, equip };
})();
</script>
</body>
</html>
