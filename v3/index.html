<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>EastCoin</title>
<link rel="canonical" href="https://eastcoin.vip/">
<script>
  /* V3 is the site now. Anything still pointing at /v3/ carries its
     query and hash across to the root, so a bookmarked view or a shared
     MultiView layout keeps working. replace() rather than assign() so
     Back does not bounce straight back here. */
  (function () {
    var to = "/" + window.location.search + window.location.hash;
    window.location.replace(to);
  })();
</script>
</head>
<body>
<p>EastCoin has moved to <a href="/">eastcoin.vip</a>.</p>
</body>
</html>
