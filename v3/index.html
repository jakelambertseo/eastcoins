<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>EastCoin V3</title>
<link href="/assets/eastcoin-favicon.svg?v=full-logo1" rel="icon" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://streamed.st">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="/v3/assets/css/v3.css?v=1">
</head>
<body>

<header class="topnav">
  <a class="brand" href="/v3/" data-route="events">
    <span class="brand-mark">E</span> EastCoin
  </a>

  <nav class="nav-links" aria-label="Main">
    <a class="nav-link" href="/v3/?view=events"    data-route="events">Events</a>
    <a class="nav-link" href="/v3/?view=multiview" data-route="multiview">MultiView</a>
    <a class="nav-link" href="/v3/?view=picks"     data-route="picks">Picks</a>
    <a class="nav-link" href="/v3/?view=music"     data-route="music">Music</a>
  </nav>

  <div class="nav-right">
    <div class="navsearch">
      <span aria-hidden="true">🔍</span>
      <input id="navSearch" type="search" placeholder="Search games, teams" aria-label="Search events" autocomplete="off">
    </div>
    <span class="wallet-chip" id="walletChip" hidden><span aria-hidden="true">🪙</span><span id="walletValue">—</span></span>
    <a class="login-btn" id="loginBtn" href="/api/picks/auth/twitch/start?returnTo=%2Fv3%2F">Log in</a>
    <button class="iconbtn on" id="chatToggle" type="button" aria-pressed="true" title="Toggle Twitch chat">💬</button>
  </div>
</header>

<div class="shell">
  <main class="view" id="view" tabindex="-1"></main>

  <aside class="chatrail" id="chatRail" aria-label="Twitch chat">
    <div class="chatrail-head">
      <span>Twitch · zwades</span>
      <button class="iconbtn" id="chatClose" type="button" title="Hide chat" style="width:26px;height:26px;font-size:.7rem">✕</button>
    </div>
    <div class="chat-placeholder" id="chatPlaceholder">
      Chat loads as soon as you interact with the page, so it never slows the first paint.
    </div>
    <iframe
      id="twitchChat"
      title="zwades Twitch chat"
      src="about:blank"
      data-src="https://www.twitch.tv/embed/zwades/chat?parent=eastcoins.pages.dev&amp;parent=eastcoin.vip&amp;parent=www.eastcoin.vip&amp;parent=localhost&amp;parent=127.0.0.1&amp;darkpopout"
      referrerpolicy="strict-origin-when-cross-origin"
      hidden></iframe>
  </aside>
</div>

<script defer src="/assets/eastcoins-ppv-api.js"></script>
<script defer src="/assets/eastcoins-streamed-api.js"></script>
<script defer src="/v3/assets/js/v3-shell.js?v=1"></script>
<script defer src="/v3/assets/js/v3-events.js?v=1"></script>
</body>
</html>
