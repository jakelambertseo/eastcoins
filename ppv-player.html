<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
  <title>PPV Player | EastCoin</title>

  <style>
    *{box-sizing:border-box}
    html,body{
      width:100%;
      height:100%;
      margin:0;
      overflow:hidden;
      background:#000;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    }

    #ppvMount{
      position:absolute;
      inset:0;
      background:#000;
    }

    #ppvMount > iframe{
      display:block!important;
      width:100%!important;
      height:100%!important;
      min-width:100%!important;
      min-height:100%!important;
      border:0!important;
    }

    .pending{
      position:absolute;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      padding:24px;
      color:#e8dfcf;
      background:
        radial-gradient(circle at 50% 20%,rgba(122,28,35,.18),transparent 36%),
        #030303;
      text-align:center;
    }

    .pending[hidden]{
      display:none!important;
    }

    .card{
      width:min(460px,100%);
      padding:22px;
      border:1px solid rgba(201,164,79,.2);
      border-radius:14px;
      background:rgba(8,8,8,.95);
      box-shadow:0 24px 70px rgba(0,0,0,.62);
    }

    .icon{
      display:grid;
      place-items:center;
      width:42px;
      height:42px;
      margin:0 auto 11px;
      border:1px solid rgba(201,164,79,.25);
      border-radius:10px;
      color:#e1c369;
      background:rgba(201,164,79,.045);
      font-size:1.05rem;
    }

    strong{
      display:block;
      font-size:.92rem;
    }

    p{
      margin:7px 0 0;
      color:#767064;
      font-size:.68rem;
      line-height:1.55;
    }

    button{
      min-height:31px;
      margin-top:13px;
      padding:6px 10px;
      border:1px solid rgba(201,164,79,.25);
      border-radius:8px;
      color:#f0d98d;
      background:rgba(122,28,35,.36);
      font:800 .64rem/1 Inter,ui-sans-serif,system-ui,sans-serif;
      cursor:pointer;
    }

    button:disabled{
      opacity:.5;
      cursor:wait;
    }
  </style>
</head>
<body>
  <div id="ppvMount"></div>

  <div class="pending" id="ppvPending">
    <div class="card">
      <div class="icon">▶</div>
      <strong id="ppvPendingTitle">Opening PPV source…</strong>
      <p id="ppvPendingCopy">
        EastCoin is resolving the current PPV embed for this event.
      </p>
      <button id="ppvRetry" type="button">Retry</button>
    </div>
  </div>

  <script src="assets/eastcoins-ppv-api.js?v=ppv2"></script>
  <script>
    (() => {
      "use strict";

      const API = window.EastcoinPpvAPI;
      const params = new URLSearchParams(
        window.location.search
      );
      const id = params.get("id") || "";

      const mount =
        document.getElementById("ppvMount");
      const pending =
        document.getElementById("ppvPending");
      const title =
        document.getElementById("ppvPendingTitle");
      const copy =
        document.getElementById("ppvPendingCopy");
      const retry =
        document.getElementById("ppvRetry");

      let mounted = false;

      function setMessage(
        heading,
        message
      ) {
        if (mounted) return;
        pending.hidden = false;
        title.textContent = heading;
        copy.textContent = message;
      }

      function mountUrl(url) {
        const resolved = new URL(
          url,
          window.location.href
        );

        if (
          ![
            "http:",
            "https:"
          ].includes(
            resolved.protocol
          )
        ) {
          throw new Error(
            "PPV returned an unsupported embed URL."
          );
        }

        /*
          Match PPV's published copyable iframe behavior.
          No sandbox is added.
        */
        const iframe =
          document.createElement("iframe");

        iframe.id = "player";
        iframe.src = resolved.href;
        iframe.setAttribute(
          "scrolling",
          "no"
        );
        iframe.setAttribute(
          "allowfullscreen",
          "yes"
        );
        iframe.setAttribute(
          "allow",
          "encrypted-media; picture-in-picture;"
        );
        iframe.setAttribute(
          "frameborder",
          "0"
        );
        iframe.style.position = "absolute";
        iframe.style.inset = "0";
        iframe.style.width = "100%";
        iframe.style.height = "100%";

        mount.replaceChildren(iframe);
        mounted = true;
        pending.hidden = true;
      }

      async function openSource(
        force = false
      ) {
        if (!API || !id) {
          setMessage(
            "PPV source unavailable",
            !id
              ? "This EastCoin PPV player did not receive an event ID."
              : "The PPV adapter could not be loaded."
          );
          return;
        }

        retry.disabled = true;

        try {
          const result =
            await API.getStreamById(
              id,
              force
            );

          if (
            result.stream &&
            result.embedUrl
          ) {
            mountUrl(
              result.embedUrl
            );
            return;
          }

          setMessage(
            "PPV source unavailable",
            result.stream
              ? "This provider listing does not include a playable iframe or uri_name."
              : "The provider does not currently list this event ID."
          );
        } catch (error) {
          setMessage(
            "PPV temporarily unavailable",
            "EastCoin could not reach the PPV API. Retry in a moment."
          );
        } finally {
          retry.disabled = false;
        }
      }

      retry.addEventListener(
        "click",
        () => openSource(true)
      );

      openSource(false);
    })();
  </script>
</body>
</html>
