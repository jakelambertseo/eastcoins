<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta
    name="robots"
    content="noindex, nofollow, noarchive, nosnippet, noimageindex"
  />
  <meta
    name="googlebot"
    content="noindex, nofollow, noarchive, nosnippet, noimageindex"
  />

  <meta name="description" content="EastCoin Button Masher with Twitch chat." />
  <title>EastCoin — Button Masher</title>

  <style>
    :root {
      --bg: #050b14;
      --sidebar: #091321;
      --panel: #0d1928;
      --panel-2: #132338;
      --line: rgba(255,255,255,.08);
      --text: #f1f6ff;
      --muted: #8ea1bb;
      --green: #55d88a;
      --green-hover: #6be59b;
      --red: #ff7777;
      --purple: #9d7aea;
      --shadow: 0 24px 60px rgba(0,0,0,.35);
      --sidebar-width: 230px;
      --chat-width: 360px;
      --divider-width: 10px;
      --min-video-width: 420px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 35% 0%, rgba(81,216,138,.08), transparent 32%),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .layout {
      display: grid;
      grid-template-columns:
        var(--sidebar-width)
        minmax(var(--min-video-width),1fr)
        var(--divider-width)
        var(--chat-width);
      width: 100%;
      height: 100vh;
      transition: grid-template-columns .24s ease;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 22px 16px;
      overflow: hidden;
      border-right: 1px solid var(--line);
      background: rgba(9,19,33,.97);
      opacity: 1;
      transform: translateX(0);
      transition:
        transform .24s ease,
        opacity .2s ease,
        padding .24s ease,
        border-color .24s ease;
      z-index: 20;
    }

    @media (min-width: 901px) {
      body.sidebar-collapsed .layout {
        grid-template-columns:
          0
          minmax(var(--min-video-width),1fr)
          var(--divider-width)
          var(--chat-width);
      }

      body.sidebar-collapsed .sidebar {
        padding-left: 0;
        padding-right: 0;
        border-right-color: transparent;
        opacity: 0;
        transform: translateX(-100%);
        pointer-events: none;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 4px 8px 24px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 13px;
      color: #07110b;
      font-weight: 950;
      background: linear-gradient(135deg, var(--green), #b7ffca);
      box-shadow: 0 10px 30px rgba(81,216,138,.2);
    }

    .brand-copy strong {
      display: block;
      letter-spacing: -.02em;
    }

    .brand-copy span {
      color: var(--muted);
      font-size: .74rem;
    }

    .nav-group {
      margin-top: 12px;
    }

    .nav-label {
      padding: 0 11px 8px;
      color: #647994;
      font-size: .67rem;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 11px;
      width: 100%;
      margin-bottom: 5px;
      padding: 11px 12px;
      border: 0;
      border-radius: 11px;
      color: var(--muted);
      background: transparent;
      text-align: left;
      font-weight: 700;
      transition: .2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--text);
      background: rgba(255,255,255,.06);
    }

    .nav-link.active {
      box-shadow: inset 3px 0 0 var(--green);
    }

    .watch-area {
      position: relative;
      min-width: 0;
      min-height: 0;
      padding: 16px;
      background: #040912;
    }

    .player-shell {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(rgba(5,11,20,.35), rgba(5,11,20,.82)),
        url("https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1800&q=85") center/cover;
      box-shadow: var(--shadow);
    }

    .player-shell.has-frame {
      background: #000;
    }

    .player-toolbar {
      position: absolute;
      inset: 0 0 auto 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 18px 16px 66px;
      background: linear-gradient(rgba(4,9,18,.95), rgba(4,9,18,.4), transparent);
      pointer-events: none;
    }

    .player-toolbar > * {
      pointer-events: auto;
    }

    .toolbar-title strong {
      display: block;
      font-size: .92rem;
    }

    .toolbar-title span {
      color: var(--muted);
      font-size: .72rem;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
    }

    .toolbar-button {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      color: var(--text);
      background: rgba(9,19,33,.78);
      font-size: .78rem;
      font-weight: 800;
      backdrop-filter: blur(12px);
    }

    .toolbar-button:hover {
      background: rgba(255,255,255,.1);
    }

    .embed-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
    }

    .url-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow-y: auto;
    }

    .url-card {
      width: min(720px,100%);
      padding: 30px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 20px;
      background: rgba(8,17,29,.88);
      box-shadow: 0 20px 60px rgba(0,0,0,.32);
      backdrop-filter: blur(18px);
      text-align: center;
    }

    .url-icon {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 16px;
      border: 1px solid rgba(81,216,138,.26);
      border-radius: 16px;
      background: rgba(81,216,138,.1);
      font-size: 1.45rem;
    }

    .url-card h1 {
      margin: 0;
      font-size: clamp(2rem,4vw,4rem);
      line-height: 1;
      letter-spacing: -.05em;
    }

    .url-card > p {
      max-width: 590px;
      margin: 14px auto 0;
      color: #c0cede;
      line-height: 1.6;
    }

    .url-form {
      margin-top: 24px;
    }

    .url-entry {
      display: flex;
      gap: 10px;
    }

    .url-entry input {
      min-width: 0;
      flex: 1;
      padding: 14px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 11px;
      outline: 0;
      color: var(--text);
      background: rgba(255,255,255,.055);
    }

    .url-entry input:focus {
      border-color: rgba(81,216,138,.65);
      box-shadow: 0 0 0 4px rgba(81,216,138,.08);
    }

    .url-entry input::placeholder {
      color: #6e819b;
    }

    .load-button {
      padding: 0 20px;
      border: 0;
      border-radius: 11px;
      color: #07110b;
      background: var(--green);
      font-weight: 950;
    }

    .load-button:hover {
      background: var(--green-hover);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-top: 12px;
      text-align: left;
    }

    .remember-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .77rem;
    }

    .remember-label input {
      accent-color: var(--green);
    }

    .url-error {
      min-height: 22px;
      margin-top: 10px;
      color: var(--red);
      font-size: .8rem;
    }

    .quick-favorites {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,.09);
    }

    .quick-favorites-label {
      margin: 0 0 11px;
      color: #91a1b6;
      font-size: .72rem;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .quick-favorites-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 9px;
    }

    .quick-favorite-button {
      min-height: 40px;
      padding: 9px 14px;
      border: 1px solid rgba(210,26,74,.32);
      border-radius: 10px;
      color: #ffe2e8;
      background:
        linear-gradient(
          180deg,
          rgba(132,11,43,.78),
          rgba(75,5,28,.84)
        );
      box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
      font-size: .82rem;
      font-weight: 900;
    }

    .quick-favorite-button:hover,
    .quick-favorite-button:focus-visible {
      border-color: rgba(255,112,145,.55);
      color: #fff;
      background:
        linear-gradient(
          180deg,
          rgba(177,15,55,.92),
          rgba(105,7,36,.94)
        );
      outline: 0;
      transform: translateY(-1px);
    }

    .all-favorites-link {
      display: inline-block;
      margin-top: 12px;
      color: #d1aa56;
      font-size: .76rem;
      font-weight: 850;
      text-decoration: none;
    }

    .all-favorites-link:hover,
    .all-favorites-link:focus-visible {
      color: #f3cc73;
      text-decoration: underline;
      outline: 0;
    }

    .resize-handle {
      position: relative;
      z-index: 30;
      width: 100%;
      height: 100%;
      cursor: col-resize;
      touch-action: none;
      background: #07101c;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
      transition: background .15s ease;
    }

    .resize-handle::before {
      content: "";
      position: absolute;
      inset: 0 -5px;
    }

    .resize-handle span {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 48px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      transform: translate(-50%,-50%);
      transition: height .15s ease, background .15s ease;
    }

    .resize-handle:hover,
    .resize-handle:focus-visible,
    body.resizing-chat .resize-handle {
      outline: 0;
      background: rgba(81,216,138,.12);
    }

    .resize-handle:hover span,
    .resize-handle:focus-visible span,
    body.resizing-chat .resize-handle span {
      height: 70px;
      background: var(--green);
    }

    body.resizing-chat,
    body.resizing-chat * {
      cursor: col-resize !important;
      user-select: none !important;
    }

    body.resizing-chat .layout {
      transition: none;
    }

    body.resizing-chat iframe {
      pointer-events: none !important;
    }

    .chat-panel {
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
      overflow: hidden;
      background: #0e0e10;
    }

    .twitch-chat-frame {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 0;
      border: 0;
      background: #0e0e10;
    }

    .mobile-menu {
      position: fixed;
      top: 16px;
      left: calc(var(--sidebar-width) - 20px);
      z-index: 60;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border: 1px solid var(--line);
      border-radius: 11px;
      color: var(--text);
      background: rgba(3,3,3,.94);
      box-shadow: 0 12px 34px rgba(0,0,0,.5);
      transition:
        left .24s ease,
        background .18s ease,
        transform .18s ease;
    }

    .mobile-menu:hover {
      background: #111;
    }

    body.sidebar-collapsed .mobile-menu {
      left: 16px;
    }

    .mobile-overlay {
      display: none;
    }

    .toast {
      position: fixed;
      right: calc(var(--chat-width) + var(--divider-width) + 24px);
      bottom: 24px;
      z-index: 100;
      max-width: 360px;
      padding: 13px 15px;
      border: 1px solid rgba(81,216,138,.35);
      border-radius: 12px;
      color: var(--text);
      background: #10233a;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: .25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 1050px) {
      :root {
        --sidebar-width: 200px;
        --chat-width: 320px;
      }

      .brand-copy span {
        display: none;
      }
    }

    @media (max-width: 900px) {
      body {
        overflow: auto;
      }

      .layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: 100vh;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 230px;
        height: 100vh;
        transform: translateX(-102%);
        transition: transform .25s ease;
      }

      body.menu-open .sidebar {
        transform: translateX(0);
      }

      .mobile-overlay {
        position: fixed;
        inset: 0;
        z-index: 15;
        display: block;
        background: rgba(0,0,0,.58);
        opacity: 0;
        pointer-events: none;
        transition: .25s ease;
      }

      body.menu-open .mobile-overlay {
        opacity: 1;
        pointer-events: auto;
      }

      .watch-area {
        min-height: 68vh;
        padding: 12px;
      }

      .mobile-menu,
      body.sidebar-collapsed .mobile-menu {
        top: 16px;
        left: 16px;
      }

      body.sidebar-collapsed .sidebar {
        opacity: 1;
        pointer-events: auto;
      }

      .player-toolbar {
        padding-left: 66px;
      }

      .resize-handle {
        display: none;
      }

      .chat-panel {
        height: 520px;
        min-height: 520px;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .toast {
        right: 18px;
        bottom: 18px;
      }
    }

    @media (max-width: 600px) {
      .watch-area {
        min-height: 72vh;
      }

      .url-stage {
        padding: 14px;
      }

      .url-card {
        padding: 24px 18px;
      }

      .url-entry {
        flex-direction: column;
      }

      .load-button {
        min-height: 46px;
      }

      .form-options {
        align-items: flex-start;
        flex-direction: column;
      }

      .player-toolbar {
        align-items: flex-start;
      }

      .toolbar-title {
        display: none;
      }

      .toolbar-actions {
        margin-left: auto;
      }
    }

  
    .brand-copy-single {
      display: flex;
      align-items: center;
      min-height: 48px;
    }

    .brand-copy-single strong {
      font-size: 1.34rem;
      line-height: 1;
      letter-spacing: -.045em;
    }

    .url-image-icon {
      width: 76px;
      height: 76px;
      padding: 0;
      overflow: hidden;
      border-color: rgba(242,196,0,.14);
      border-radius: 22px;
      background: #020202;
    }

    .url-image-icon img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

  
    #shareButton.toolbar-button,
    #shareButton.share-room-button {
      color: #fff3f5 !important;
      border-color: #e33a62 !important;
      background-color: #9f1239 !important;
      background-image:
        linear-gradient(
          180deg,
          #d51f51 0%,
          #9f1239 55%,
          #700925 100%
        ) !important;
      box-shadow:
        0 10px 28px rgba(213,31,81,.36),
        inset 0 1px 0 rgba(255,255,255,.18) !important;
    }

    #shareButton.toolbar-button:hover,
    #shareButton.toolbar-button:focus-visible,
    #shareButton.share-room-button:hover,
    #shareButton.share-room-button:focus-visible {
      color: #fff !important;
      border-color: #ff7897 !important;
      background-color: #c21749 !important;
      background-image:
        linear-gradient(
          180deg,
          #ef3d68 0%,
          #c21749 55%,
          #870b2d 100%
        ) !important;
      box-shadow:
        0 13px 34px rgba(213,31,81,.5),
        inset 0 1px 0 rgba(255,255,255,.22) !important;
      outline: 0;
      transform: translateY(-1px);
    }

  
    /* ---------------- EMBEDDED GAMES ---------------- */

    .player-shell {
      background:
        radial-gradient(circle at 82% 8%, rgba(210,26,74,.17), transparent 29%),
        radial-gradient(circle at 16% 90%, rgba(242,196,0,.075), transparent 28%),
        linear-gradient(155deg, #090909, #030303);
    }

    .games-stage {
      align-items: start;
      justify-items: stretch;
      padding: 28px;
    }

    .games-library {
      width: min(1000px, 100%);
      margin: 0 auto;
      padding: 24px 0 34px;
    }

    .games-heading {
      text-align: center;
    }

    .games-heading-icon {
      display: grid;
      place-items: center;
      width: 70px;
      height: 70px;
      margin: 0 auto 16px;
      border: 1px solid rgba(210,26,74,.27);
      border-radius: 18px;
      background:
        linear-gradient(
          180deg,
          rgba(166,13,49,.85),
          rgba(73,4,24,.9)
        );
      box-shadow:
        0 16px 34px rgba(173,9,50,.19),
        inset 0 1px 0 rgba(255,255,255,.08);
      font-size: 1.9rem;
    }

    .games-heading h1 {
      margin: 0;
      font-size: clamp(2.5rem, 5vw, 5rem);
      line-height: .95;
      letter-spacing: -.065em;
    }

    .games-heading > p {
      max-width: 680px;
      margin: 13px auto 0;
      color: #a0a0a0;
      line-height: 1.65;
    }

    .game-room-form {
      max-width: 800px;
      margin: 22px auto 0;
      padding: 16px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 14px;
      background: rgba(8,8,8,.75);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.025);
    }

    .game-room-form-label {
      display: block;
      margin-bottom: 9px;
      color: #7e7e7e;
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .11em;
      text-align: left;
      text-transform: uppercase;
    }

    .game-room-entry {
      display: flex;
      gap: 9px;
    }

    .game-room-entry input {
      min-width: 0;
      flex: 1;
      padding: 13px 14px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 10px;
      outline: 0;
      color: #f4f4f4;
      background: rgba(255,255,255,.045);
    }

    .game-room-entry input:focus {
      border-color: rgba(210,26,74,.55);
      box-shadow: 0 0 0 4px rgba(210,26,74,.08);
    }

    .game-room-entry input::placeholder {
      color: #5f5f5f;
    }

    .load-game-button {
      padding: 0 18px;
      border: 1px solid #e33a62;
      border-radius: 10px;
      color: #fff;
      background:
        linear-gradient(
          180deg,
          #d51f51,
          #8c0d31
        );
      font-weight: 900;
    }

    .load-game-button:hover,
    .load-game-button:focus-visible {
      background:
        linear-gradient(
          180deg,
          #ef3d68,
          #a6113d
        );
      outline: 0;
    }

    .game-url-error {
      min-height: 20px;
      margin-top: 8px;
      color: #ff8da0;
      font-size: .72rem;
      text-align: left;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 20px;
    }

    .game-card {
      position: relative;
      display: flex;
      min-height: 220px;
      flex-direction: column;
      overflow: hidden;
      padding: 19px;
      border: 1px solid rgba(255,255,255,.075);
      border-radius: 16px;
      color: #f1f1f1;
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(176,16,52,.12),
          transparent 40%
        ),
        linear-gradient(180deg, #0e0e0e, #070707);
      box-shadow:
        0 16px 36px rgba(0,0,0,.24),
        inset 0 1px 0 rgba(255,255,255,.025);
      text-align: left;
      transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
    }

    .game-card:hover,
    .game-card:focus-visible {
      border-color: rgba(210,26,74,.4);
      background:
        radial-gradient(
          circle at 100% 0%,
          rgba(210,26,74,.18),
          transparent 42%
        ),
        linear-gradient(180deg, #141414, #080808);
      outline: 0;
      transform: translateY(-3px);
    }

    .game-card-icon {
      display: grid;
      place-items: center;
      width: 50px;
      height: 50px;
      border: 1px solid rgba(210,26,74,.22);
      border-radius: 14px;
      background:
        linear-gradient(
          180deg,
          rgba(150,11,44,.72),
          rgba(68,4,23,.83)
        );
      box-shadow: 0 12px 27px rgba(173,9,50,.14);
      font-size: 1.45rem;
    }

    .game-card h2 {
      margin: 16px 0 6px;
      font-size: 1.14rem;
      letter-spacing: -.035em;
    }

    .game-card p {
      margin: 0;
      color: #858585;
      font-size: .77rem;
      line-height: 1.58;
    }

    .game-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;

    function decodeEmbeddedGame(base64Value) {
      const binary = atob(base64Value);
      const bytes = new Uint8Array(binary.length);

      for (let index = 0; index < binary.length; index++) {
        bytes[index] = binary.charCodeAt(index);
      }

      return new TextDecoder("utf-8").decode(bytes);
    }

    const embeddedGameFrame = document.getElementById("buttonMasherFrame");
    embeddedGameFrame.srcdoc = decodeEmbeddedGame(BUTTON_MASHER_GAME_SOURCE);



    // A full EastCoin page may occasionally be opened inside the active
    // game or video iframe. Sidebar navigation must escape that frame.
    document.addEventListener(
      "click",
      (event) => {
        const link = event.target.closest(".nav-link");

        if (!link || window.self === window.top) {
          return;
        }

        event.preventDefault();

        try {
          window.top.location.href = link.href;
        } catch {
          window.open(link.href, "_top");
        }
      },
      true
    );

    const SIDEBAR_STORAGE_KEY = "eastcoinsSidebarCollapsed";

    function isMobileNavigation() {
      return window.matchMedia("(max-width: 900px)").matches;
    }

    function updateNavigationButton() {
      if (isMobileNavigation()) {
        const open = body.classList.contains("menu-open");
        mobileMenu.textContent = open ? "✕" : "☰";
        mobileMenu.setAttribute(
          "aria-label",
          open ? "Close navigation" : "Open navigation"
        );
        mobileMenu.setAttribute("aria-expanded", String(open));
        return;
      }

      const collapsed = body.classList.contains("sidebar-collapsed");
      mobileMenu.textContent = collapsed ? "☰" : "◀";
      mobileMenu.setAttribute(
        "aria-label",
        collapsed ? "Show navigation" : "Hide navigation"
      );
      mobileMenu.setAttribute("aria-expanded", String(!collapsed));
    }

    function setDesktopSidebarCollapsed(collapsed, save = true) {
      body.classList.toggle("sidebar-collapsed", collapsed);

      if (save) {
        localStorage.setItem(
          SIDEBAR_STORAGE_KEY,
          String(collapsed)
        );
      }

      updateNavigationButton();
    }

    mobileMenu.addEventListener("click", () => {
      if (isMobileNavigation()) {
        body.classList.toggle("menu-open");
        updateNavigationButton();
        return;
      }

      setDesktopSidebarCollapsed(
        !body.classList.contains("sidebar-collapsed")
      );
    });

    mobileOverlay.addEventListener("click", () => {
      body.classList.remove("menu-open");
      updateNavigationButton();
    });

    document.querySelectorAll(".nav-link").forEach((link) => {
      link.addEventListener("click", () => {
        body.classList.remove("menu-open");
        updateNavigationButton();
      });
    });

    const CHAT_WIDTH_STORAGE_KEY = "eastcoinsChatWidthV2";
    const DEFAULT_CHAT_WIDTH = 360;
    const MIN_CHAT_WIDTH = 280;
    const MIN_VIDEO_WIDTH = 420;
    let activePointerId = null;

    function getChatWidthLimits() {
      const layoutWidth = layout.getBoundingClientRect().width;
      const sidebarWidth = sidebar.getBoundingClientRect().width;
      const dividerWidth =
        resizeHandle.getBoundingClientRect().width;

      const availableMaximum =
        layoutWidth -
        sidebarWidth -
        dividerWidth -
        MIN_VIDEO_WIDTH;
      const practicalMaximum =
        Math.min(560, layoutWidth * 0.38);

      return {
        min: MIN_CHAT_WIDTH,
        max: Math.max(
          MIN_CHAT_WIDTH,
          Math.min(availableMaximum, practicalMaximum)
        )
      };
    }

    function clampChatWidth(width) {
      const limits = getChatWidthLimits();
      return Math.min(
        Math.max(width, limits.min),
        limits.max
      );
    }

    function setChatWidth(width, save = false) {
      if (window.innerWidth <= 900) {
        return;
      }

      const clampedWidth = Math.round(clampChatWidth(width));

      document.documentElement.style.setProperty(
        "--chat-width",
        `${clampedWidth}px`
      );

      resizeHandle.setAttribute(
        "aria-valuenow",
        String(clampedWidth)
      );

      resizeHandle.setAttribute(
        "aria-valuemax",
        String(Math.round(getChatWidthLimits().max))
      );

      if (save) {
        localStorage.setItem(
          CHAT_WIDTH_STORAGE_KEY,
          String(clampedWidth)
        );
      }
    }

    function widthFromPointer(clientX) {
      const layoutRect = layout.getBoundingClientRect();
      return layoutRect.right - clientX;
    }

    resizeHandle.addEventListener("pointerdown", (event) => {
      if (
        window.innerWidth <= 900 ||
        event.button !== 0
      ) {
        return;
      }

      activePointerId = event.pointerId;
      resizeHandle.setPointerCapture(activePointerId);
      body.classList.add("resizing-chat");
      setChatWidth(widthFromPointer(event.clientX));
      event.preventDefault();
    });

    resizeHandle.addEventListener("pointermove", (event) => {
      if (event.pointerId !== activePointerId) {
        return;
      }

      setChatWidth(widthFromPointer(event.clientX));
    });

    function finishChatResize(event) {
      if (event.pointerId !== activePointerId) {
        return;
      }

      setChatWidth(
        widthFromPointer(event.clientX),
        true
      );

      body.classList.remove("resizing-chat");

      if (resizeHandle.hasPointerCapture(activePointerId)) {
        resizeHandle.releasePointerCapture(activePointerId);
      }

      activePointerId = null;
    }

    resizeHandle.addEventListener(
      "pointerup",
      finishChatResize
    );

    resizeHandle.addEventListener(
      "pointercancel",
      (event) => {
        if (event.pointerId !== activePointerId) {
          return;
        }

        body.classList.remove("resizing-chat");
        activePointerId = null;
      }
    );

    resizeHandle.addEventListener("keydown", (event) => {
      if (window.innerWidth <= 900) {
        return;
      }

      const currentWidth =
        parseFloat(
          getComputedStyle(document.documentElement)
            .getPropertyValue("--chat-width")
        ) || DEFAULT_CHAT_WIDTH;

      const step = event.shiftKey ? 50 : 20;
      let nextWidth = currentWidth;

      if (event.key === "ArrowLeft") {
        nextWidth += step;
      } else if (event.key === "ArrowRight") {
        nextWidth -= step;
      } else if (event.key === "Home") {
        nextWidth = MIN_CHAT_WIDTH;
      } else if (event.key === "End") {
        nextWidth = getChatWidthLimits().max;
      } else {
        return;
      }

      event.preventDefault();
      setChatWidth(nextWidth, true);
    });

    resizeHandle.addEventListener("dblclick", () => {
      setChatWidth(DEFAULT_CHAT_WIDTH, true);
    });

    window.addEventListener("resize", () => {
      body.classList.remove("menu-open");

      if (window.innerWidth > 900) {
        const currentWidth =
          parseFloat(
            getComputedStyle(document.documentElement)
              .getPropertyValue("--chat-width")
          ) || DEFAULT_CHAT_WIDTH;

        setChatWidth(currentWidth);
      }

      updateNavigationButton();
    });

    const savedSidebarState =
      localStorage.getItem(SIDEBAR_STORAGE_KEY) === "true";

    if (!isMobileNavigation()) {
      setDesktopSidebarCollapsed(
        savedSidebarState,
        false
      );
    } else {
      updateNavigationButton();
    }

    const savedChatWidth =
      Number(localStorage.getItem(CHAT_WIDTH_STORAGE_KEY));

    if (
      Number.isFinite(savedChatWidth) &&
      savedChatWidth > 0
    ) {
      setChatWidth(savedChatWidth);
    } else {
      setChatWidth(DEFAULT_CHAT_WIDTH);
    }

    function initializeFootballCountdowns() {
      const kickoffTime =
        new Date("2026-09-09T19:20:00-05:00");

      document
        .querySelectorAll("[data-football-countdown]")
        .forEach((countdown) => {
          const daysElement = countdown.querySelector(
            "[data-countdown-days]"
          );
          const hoursElement = countdown.querySelector(
            "[data-countdown-hours]"
          );
          const minutesElement = countdown.querySelector(
            "[data-countdown-minutes]"
          );
          const secondsElement = countdown.querySelector(
            "[data-countdown-seconds]"
          );
          const titleElement = countdown.querySelector(
            ".football-countdown-title"
          );
          const statusElement = countdown.querySelector(
            ".football-countdown-live"
          );

          function updateFootballCountdown() {
            const remaining =
              kickoffTime.getTime() - Date.now();

            if (remaining <= 0) {
              countdown.classList.add("is-live");
              titleElement.textContent = "Football is back";
              statusElement.textContent = "Live";
              daysElement.textContent = "00";
              hoursElement.textContent = "00";
              minutesElement.textContent = "00";
              secondsElement.textContent = "00";
              return false;
            }

            const totalSeconds =
              Math.floor(remaining / 1000);
            const days =
              Math.floor(totalSeconds / 86400);
            const hours =
              Math.floor((totalSeconds % 86400) / 3600);
            const minutes =
              Math.floor((totalSeconds % 3600) / 60);
            const seconds =
              totalSeconds % 60;

            daysElement.textContent = String(days);
            hoursElement.textContent =
              String(hours).padStart(2, "0");
            minutesElement.textContent =
              String(minutes).padStart(2, "0");
            secondsElement.textContent =
              String(seconds).padStart(2, "0");

            return true;
          }

          updateFootballCountdown();

          const countdownTimer =
            window.setInterval(() => {
              if (!updateFootballCountdown()) {
                window.clearInterval(countdownTimer);
              }
            }, 1000);
        });
    }

    initializeFootballCountdowns();
  </script>
</body>
</html>
